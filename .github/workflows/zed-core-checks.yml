name: Zed core checks

on:
  push:
    branches:
      - zed-core-engine-upgrade
      - zed-universal-file-analysis
      - zed-v2-ai-engine
      - zed-comprehensive-repair-20261031
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const report = require('./npm-audit.json'); for (const [name, item] of Object.entries(report.vulnerabilities || {})) { const via = (item.via || []).map(entry => typeof entry === 'string' ? entry : entry.title); console.log(JSON.stringify({ name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable, via })); }"
      - name: Preview non-breaking dependency fixes
        run: npm audit fix --dry-run || true
      - name: Run syntax checks
        run: npm test

name: Zed core checks

on:
  push:
    branches:
      - zed-core-engine-upgrade
      - zed-universal-file-analysis
      - zed-v2-ai-engine
      - zed-comprehensive-repair-20261031
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Enforce dependency security audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const report = require('./npm-audit.json'); const vulnerabilities = report.vulnerabilities || {}; for (const [name, item] of Object.entries(vulnerabilities)) { const via = (item.via || []).map(entry => typeof entry === 'string' ? entry : entry.title); console.log(JSON.stringify({ name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable, via })); } const total = report.metadata?.vulnerabilities?.total ?? Object.keys(vulnerabilities).length; console.log('npm audit vulnerability total:', total); if (total > 0) process.exit(1);"
      - name: Upload generated dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: zed-generated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Run syntax checks
        run: npm test

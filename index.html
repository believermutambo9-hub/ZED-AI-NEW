<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#212121">
<title>Zed AI</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#212121;
  color:#ececec;
}

button,textarea{font:inherit}

button{cursor:pointer}

/* APP */

.app{
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* SIDEBAR */

.sidebar{
  width:260px;
  background:#171717;
  display:flex;
  flex-direction:column;
  padding:10px;
  flex-shrink:0;
  border-right:1px solid #292929;
}

.brand{
  height:48px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 10px;
  margin-bottom:5px;
}

.logo{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#7ee2a8;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.brand strong{
  font-size:17px;
}

.brand span{
  color:#7ee2a8;
}

.new-chat{
  width:100%;
  height:46px;
  border:1px solid #3a3a3a;
  background:#212121;
  color:#eee;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 13px;
  margin-bottom:18px;
}

.new-chat:hover{
  background:#2a2a2a;
}

.new-icon{
  font-size:21px;
}

/* HISTORY */

.history-label{
  color:#8e8e8e;
  font-size:12px;
  padding:8px 10px;
}

.history{
  flex:1;
  overflow-y:auto;
}

.history-item{
  display:flex;
  align-items:center;
  width:100%;
  min-height:40px;
  border-radius:8px;
  padding:0 8px 0 11px;
  color:#c9c9c9;
  margin-bottom:2px;
}

.history-item:hover,
.history-item.active{
  background:#2a2a2a;
}

.history-title{
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
}

.history-delete{
  border:0;
  background:transparent;
  color:#777;
  width:28px;
  height:28px;
  border-radius:6px;
}

.history-delete:hover{
  background:#3a3a3a;
  color:#ff7070;
}

.empty{
  color:#777;
  font-size:12px;
  padding:12px 10px;
}

/* SIDEBAR BOTTOM */

.sidebar-bottom{
  border-top:1px solid #303030;
  padding-top:10px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  color:#aaa;
  font-size:12px;
  padding:10px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#65d98d;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* TOPBAR */

.topbar{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid #292929;
  background:#212121;
  flex-shrink:0;
}

.menu{
  display:none;
  width:38px;
  height:38px;
  border:0;
  background:transparent;
  color:#ddd;
  font-size:21px;
  border-radius:8px;
  margin-right:7px;
}

.menu:hover{
  background:#303030;
}

.title{
  font-size:15px;
  font-weight:600;
}

/* CHAT */

.chat-area{
  flex:1;
  overflow-y:auto;
  scroll-behavior:smooth;
}

.chat-inner{
  width:min(820px,100%);
  margin:auto;
  padding:35px 20px 150px;
}

/* WELCOME */

.welcome{
  min-height:65vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.welcome-logo{
  width:58px;
  height:58px;
  border-radius:17px;
  background:#7ee2a8;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:900;
  margin-bottom:22px;
}

.welcome h1{
  margin:0;
  font-size:34px;
  font-weight:600;
}

.welcome h1 span{
  color:#7ee2a8;
}

.welcome p{
  color:#999;
  max-width:520px;
  line-height:1.6;
  margin:12px 0 30px;
}

.prompts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  width:min(650px,100%);
}

.prompt{
  border:1px solid #3a3a3a;
  background:#292929;
  color:#ddd;
  padding:15px;
  border-radius:10px;
  text-align:left;
}

.prompt:hover{
  background:#323232;
}

.prompt strong{
  display:block;
  font-size:13px;
  margin-bottom:5px;
}

.prompt span{
  color:#888;
  font-size:12px;
}

/* MESSAGE */

.message{
  display:flex;
  gap:15px;
  margin:25px 0;
}

.avatar{
  width:32px;
  height:32px;
  flex-shrink:0;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:bold;
}

.avatar.ai{
  background:#7ee2a8;
  color:#111;
}

.avatar.user{
  background:#444;
  color:#eee;
}

.message-body{
  flex:1;
  min-width:0;
}

.name{
  font-size:13px;
  font-weight:600;
  margin:2px 0 7px;
}

.text{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.7;
  color:#e5e5e5;
  font-size:15px;
}

/* THINKING */

.thinking{
  display:flex;
  gap:5px;
  padding:8px 0;
}

.thinking i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#999;
  animation:bounce 1.2s infinite;
}

.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}

@keyframes bounce{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.35;
  }
  30%{
    transform:translateY(-5px);
    opacity:1;
  }
}

/* COMPOSER */

.composer-area{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:20px;
  background:linear-gradient(
    transparent,
    #212121 28%
  );
}

.composer{
  width:min(820px,100%);
  margin:auto;
  background:#2f2f2f;
  border:1px solid #444;
  border-radius:17px;
  padding:9px 10px 9px 14px;
  display:flex;
  align-items:flex-end;
  box-shadow:0 5px 30px #0005;
}

.input{
  flex:1;
  min-width:0;
  max-height:180px;
  min-height:42px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:10px 5px;
  line-height:1.5;
}

.input::placeholder{
  color:#888;
}

.send{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#7ee2a8;
  color:#111;
  font-size:20px;
  font-weight:bold;
  flex-shrink:0;
}

.send:hover{
  background:#9aefbd;
}

.send:disabled{
  opacity:.4;
}

.disclaimer{
  text-align:center;
  color:#666;
  font-size:10px;
  margin-top:7px;
}

/* MOBILE */

@media(max-width:700px){

  .sidebar{
    position:fixed;
    left:-270px;
    top:0;
    bottom:0;
    z-index:100;
    transition:.2s;
    box-shadow:10px 0 40px #0008;
  }

  .sidebar.open{
    left:0;
  }

  .menu{
    display:block;
  }

  .topbar{
    padding:0 10px;
  }

  .chat-inner{
    padding:20px 13px 145px;
  }

  .composer-area{
    padding:10px;
  }

  .prompts{
    grid-template-columns:1fr;
  }

  .welcome h1{
    font-size:29px;
  }

  .welcome p{
    font-size:14px;
  }

  .message{
    gap:10px;
    margin:21px 0;
  }

  .text{
    font-size:14px;
  }
}

@media(max-width:400px){

  .welcome-logo{
    width:50px;
    height:50px;
  }

  .welcome h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">Z</div>
      <strong>Zed <span>AI</span></strong>
    </div>

    <button class="new-chat" id="newChat">
      <span class="new-icon">＋</span>
      <span>New chat</span>
    </button>

    <div class="history-label">Recent chats</div>

    <div class="history" id="history"></div>

    <div class="sidebar-bottom">
      <div class="status">
        <span class="dot"></span>
        Zed AI is online
      </div>
    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button class="menu" id="menu">☰</button>

      <div class="title" id="title">
        Zed AI
      </div>

    </header>


    <section class="chat-area" id="chatArea">

      <div class="chat-inner" id="chatInner"></div>

    </section>


    <div class="composer-area">

      <div class="composer">

        <textarea
          id="input"
          class="input"
          placeholder="Message Zed AI..."
          rows="1"
        ></textarea>

        <button
          id="send"
          class="send"
          type="button"
          aria-label="Send"
        >↑</button>

      </div>

      <div class="disclaimer">
        Zed AI can make mistakes. Check important information.
      </div>

    </div>

  </main>

</div>


<script>
"use strict";

/* =========================
   ELEMENTS
========================= */

const input = document.getElementById("input");
const send = document.getElementById("send");
const chatInner = document.getElementById("chatInner");
const chatArea = document.getElementById("chatArea");
const history = document.getElementById("history");
const newChatButton = document.getElementById("newChat");
const menu = document.getElementById("menu");
const sidebar = document.getElementById("sidebar");
const title = document.getElementById("title");


/* =========================
   STATE
========================= */

const STORAGE_KEY = "zed_ai_chats_v2";

let chats = [];
let currentChatId = null;
let messages = [];
let sending = false;


/* =========================
   STORAGE
========================= */

function saveChats(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(chats)
  );
}

function loadChats(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    chats =
      saved ? JSON.parse(saved) : [];

    if(!Array.isArray(chats)){
      chats = [];
    }

  }catch(error){

    console.error(error);
    chats = [];

  }
}


/* =========================
   WELCOME
========================= */

function showWelcome(){

  chatInner.innerHTML = `
    <div class="welcome">

      <div class="welcome-logo">Z</div>

      <h1>How can <span>Zed AI</span> help?</h1>

      <p>
        Ask questions, learn new things, write,
        plan your business or get help with everyday tasks.
      </p>

      <div class="prompts">

        <button class="prompt" data-prompt="Help me create a professional CV.">
          <strong>📄 Create a CV</strong>
          <span>Build a professional CV step by step.</span>
        </button>

        <button class="prompt" data-prompt="Give me realistic business ideas I can start in Zambia with a small budget.">
          <strong>💼 Business ideas</strong>
          <span>Find practical business opportunities.</span>
        </button>

        <button class="prompt" data-prompt="Teach me something interesting in a simple way.">
          <strong>📚 Learn something</strong>
          <span>Understand difficult topics easily.</span>
        </button>

        <button class="prompt" data-prompt="Help me write a professional message.">
          <strong>✍️ Help me write</strong>
          <span>Improve your messages and writing.</span>
        </button>

      </div>

    </div>
  `;

  document
    .querySelectorAll(".prompt")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          input.value =
            button.dataset.prompt;

          resizeInput();
          input.focus();

        }
      );

    });

}


/* =========================
   HISTORY
========================= */

function renderHistory(){

  history.innerHTML = "";

  if(!chats.length){

    history.innerHTML =
      `<div class="empty">No conversations yet.</div>`;

    return;
  }

  chats
    .slice()
    .sort(
      (a,b) =>
        (b.updatedAt || 0) -
        (a.updatedAt || 0)
    )
    .forEach(chat => {

      const item =
        document.createElement("div");

      item.className =
        "history-item" +
        (chat.id === currentChatId
          ? " active"
          : "");

      const chatTitle =
        document.createElement("div");

      chatTitle.className =
        "history-title";

      chatTitle.textContent =
        chat.title || "New chat";

      chatTitle.addEventListener(
        "click",
        () => loadChat(chat.id)
      );

      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "history-delete";

      deleteButton.textContent =
        "×";

      deleteButton.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          deleteChat(chat.id);

        }
      );

      item.appendChild(chatTitle);
      item.appendChild(deleteButton);

      history.appendChild(item);

    });

}


/* =========================
   CHAT
========================= */

function createChat(){

  const now = Date.now();

  const chat = {
    id:String(now),
    title:"New chat",
    messages:[],
    createdAt:now,
    updatedAt:now
  };

  chats.unshift(chat);

  currentChatId =
    chat.id;

  messages = [];

  saveChats();
  renderHistory();
  updateTitle();

  showWelcome();

  return chat;
}


function currentChat(){

  return chats.find(
    chat => chat.id === currentChatId
  );

}


function ensureChat(){

  let chat = currentChat();

  if(!chat){
    chat = createChat();
  }

  return chat;

}


function makeTitle(text){

  const clean =
    text
      .replace(/\s+/g," ")
      .trim();

  if(clean.length <= 40){
    return clean;
  }

  return clean.substring(0,40) + "...";

}


function saveCurrentChat(){

  const chat =
    currentChat();

  if(!chat){
    return;
  }

  chat.messages =
    messages.map(
      message => ({
        role:message.role,
        text:message.text
      })
    );

  chat.updatedAt =
    Date.now();

  const firstUser =
    messages.find(
      message =>
        message.role === "user"
    );

  if(firstUser){
    chat.title =
      makeTitle(firstUser.text);
  }

  saveChats();
  renderHistory();
  updateTitle();

}


function updateTitle(){

  const chat =
    currentChat();

  title.textContent =
    chat?.title || "Zed AI";

}


/* =========================
   LOAD CHAT
========================= */

function loadChat(id){

  const chat =
    chats.find(
      item => item.id === id
    );

  if(!chat){
    return;
  }

  currentChatId =
    chat.id;

  messages =
    Array.isArray(chat.messages)
      ? chat.messages
      : [];

  updateTitle();
  renderHistory();
  renderMessages();

  sidebar.classList.remove("open");

}


/* =========================
   DELETE CHAT
========================= */

function deleteChat(id){

  if(!confirm("Delete this conversation?")){
    return;
  }

  chats =
    chats.filter(
      chat => chat.id !== id
    );

  if(currentChatId === id){

    currentChatId = null;
    messages = [];

    if(chats.length){

      const latest =
        chats
          .slice()
          .sort(
            (a,b) =>
              (b.updatedAt || 0) -
              (a.updatedAt || 0)
          )[0];

      currentChatId =
        latest.id;

      messages =
        latest.messages || [];

      updateTitle();
      renderMessages();

    }else{

      title.textContent =
        "Zed AI";

      showWelcome();

    }

  }

  saveChats();
  renderHistory();

}


/* =========================
   NEW CHAT
========================= */

function newChat(){

  createChat();

  input.value = "";

  resizeInput();

  input.focus();

  sidebar.classList.remove("open");

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(){

  chatInner.innerHTML = "";

  if(!messages.length){

    showWelcome();
    return;

  }

  messages.forEach(message => {

    addMessage(
      message.text,
      message.role === "user"
        ? "user"
        : "ai"
    );

  });

  scrollBottom();

}


function addMessage(text,role){

  const message =
    document.createElement("div");

  message.className =
    "message";

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar " + role;

  avatar.textContent =
    role === "user"
      ? "You"
      : "Z";

  const body =
    document.createElement("div");

  body.className =
    "message-body";

  const name =
    document.createElement("div");

  name.className =
    "name";

  name.textContent =
    role === "user"
      ? "You"
      : "Zed AI";

  const textElement =
    document.createElement("div");

  textElement.className =
    "text";

  textElement.textContent =
    text;

  body.appendChild(name);
  body.appendChild(textElement);

  message.appendChild(avatar);
  message.appendChild(body);

  chatInner.appendChild(message);

}


/* =========================
   THINKING
========================= */

function showThinking(){

  const message =
    document.createElement("div");

  message.className =
    "message";

  message.id =
    "thinking";

  message.innerHTML = `
    <div class="avatar ai">Z</div>

    <div class="message-body">

      <div class="name">Zed AI</div>

      <div class="thinking">
        <i></i>
        <i></i>
        <i></i>
      </div>

    </div>
  `;

  chatInner.appendChild(message);

  scrollBottom();

}


function removeThinking(){

  const thinking =
    document.getElementById("thinking");

  if(thinking){
    thinking.remove();
  }

}


/* =========================
   SEND
========================= */

async function sendMessage(){

  if(sending){
    return;
  }

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  ensureChat();

  sending = true;
  send.disabled = true;

  input.value = "";

  resizeInput();

  messages.push({
    role:"user",
    text:text
  });

  renderMessages();

  saveCurrentChat();

  showThinking();

  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            message:text
          })
        }
      );

    const raw =
      await response.text();

    let data;

    try{

      data =
        JSON.parse(raw);

    }catch(error){

      throw new Error(
        "Server returned an invalid response."
      );

    }

    removeThinking();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Zed AI could not answer."
      );

    }

    const reply =
      typeof data.reply === "string"
        ? data.reply.trim()
        : "";

    if(!reply){

      throw new Error(
        "Zed AI returned an empty response."
      );

    }

    messages.push({
      role:"assistant",
      text:reply
    });

    renderMessages();
    saveCurrentChat();

  }catch(error){

    removeThinking();

    addMessage(
      "Sorry, I couldn't complete that request. " +
      error.message,
      "ai"
    );

    console.error(
      "Zed AI error:",
      error
    );

  }finally{

    sending = false;
    send.disabled = false;

    input.focus();

  }

}


/* =========================
   INPUT
========================= */

function resizeInput(){

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      180
    ) + "px";

}


input.addEventListener(
  "input",
  resizeInput
);


input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   BUTTONS
========================= */

send.addEventListener(
  "click",
  sendMessage
);

newChatButton.addEventListener(
  "click",
  newChat
);

menu.addEventListener(
  "click",
  () => {
    sidebar.classList.toggle("open");
  }
);


/* =========================
   START
========================= */

loadChats();

if(chats.length){

  const latest =
    chats
      .slice()
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      )[0];

  currentChatId =
    latest.id;

  messages =
    Array.isArray(latest.messages)
      ? latest.messages
      : [];

  updateTitle();
  renderHistory();
  renderMessages();

}else{

  renderHistory();
  showWelcome();

}

input.focus();

</script>

</body>
</html>

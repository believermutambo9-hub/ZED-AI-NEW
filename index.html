<script type="module">

/* =========================
   FIREBASE
========================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDocs,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyD1jcmrhZK_XitZu-9Wa9whFB7BJZn0Wa8",
  authDomain: "zed-ai-6d201.firebaseapp.com",
  projectId: "zed-ai-6d201",
  storageBucket: "zed-ai-6d201.firebasestorage.app",
  messagingSenderId: "538225665227",
  appId: "1:538225665227:web:d61483c3cafa8e4694e74e"
};


const firebaseConfigured =
  !Object.values(firebaseConfig)
    .some(value =>
      String(value).startsWith("YOUR_")
    );


let auth = null;
let googleProvider = null;
let db = null;


if (firebaseConfigured) {

  const firebaseApp =
    initializeApp(firebaseConfig);

  auth =
    getAuth(firebaseApp);

  googleProvider =
    new GoogleAuthProvider();

  db =
    getFirestore(firebaseApp);

}


/* =========================
   ELEMENTS
========================= */

const authScreen =
  document.getElementById("authScreen");

const app =
  document.getElementById("app");

const googleLogin =
  document.getElementById("googleLogin");

const emailInput =
  document.getElementById("emailInput");

const passwordInput =
  document.getElementById("passwordInput");

const emailLogin =
  document.getElementById("emailLogin");

const createAccount =
  document.getElementById("createAccount");

const authError =
  document.getElementById("authError");

const accountBox =
  document.getElementById("accountBox");

const userPhoto =
  document.getElementById("userPhoto");

const userName =
  document.getElementById("userName");

const userEmail =
  document.getElementById("userEmail");

const logoutButton =
  document.getElementById("logoutButton");

const history =
  document.getElementById("history");

const newChatButton =
  document.getElementById("newChatButton");

const menuButton =

const sidebar =

const chatArea =
  document.getElementById("chatArea");

const chatInner =
  document.getElementById("chatInner");

const input =
  document.getElementById("input");

const send =
  document.getElementById("sendButton");

const mic =
  document.getElementById("micButton");

const attachButton =

const attachMenu =

const photoButton =

const fileButton =

const imageButton =
  document.getElementById("imageButton");

const photoInput =
  document.getElementById("photoInput");

const fileInput =
  document.getElementById("fileInput");

const filePreview =

const filePreviewName =

const removeFile =
  document.getElementById("removeFile");

const status =

/* =========================
   APP DATA
========================= */

let messages = [];

let selectedFile = null;

let memories = [];

let userId = "guest";

let currentChatId = null;


/* =========================
   LOCAL STORAGE
========================= */

function getStorageKey() {

  return "zed_ai_chats";

}


function getChats() {

  try {

    return JSON.parse(
      localStorage.getItem(
        getStorageKey()
      ) || "[]"
    );

  } catch {

    return [];

  }

}


function saveChats(chats) {

  localStorage.setItem(
    getStorageKey(),
    JSON.stringify(chats)
  );

}


/* =========================
   FIRESTORE CHAT PATH
========================= */

function getUserChatsCollection() {

  if (!db || !userId || userId === "guest") {
    return null;
  }

  return collection(
    db,
    "users",
    userId,
    "chats"
  );

}


/* =========================
   SAVE CHAT TO FIRESTORE
========================= */

async function saveChatToCloud() {

  if (
    !db ||
    !userId ||
    userId === "guest" ||
    !messages.length
  ) {
    return;
  }

  try {

    const chatsCollection =
      getUserChatsCollection();

    if (!chatsCollection) {
      return;
    }

    if (!currentChatId) {

      currentChatId =
        doc(chatsCollection).id;

    }

    const firstUserMessage =
      messages.find(
        message =>
          message.role === "user"
      );

    const title =
      firstUserMessage
        ? firstUserMessage.content
            .replace(/\s+/g, " ")
            .slice(0, 45)
        : "New conversation";

    await setDoc(
      doc(
        db,
        "users",
        userId,
        "chats",
        currentChatId
      ),
      {
        title,
        messages,
        updatedAt:
          new Date().toISOString(),
        createdAt:
          new Date().toISOString()
      },
      {
        merge: true
      }
    );

  } catch (error) {

    console.error(
      "Firestore save error:",
      error
    );

  }

}


/* =========================
   LOAD CLOUD HISTORY
========================= */

async function loadCloudHistory() {

  if (
    !db ||
    !userId ||
    userId === "guest"
  ) {
    renderLocalHistory();
    return;
  }

  try {

    const chatsCollection =
      getUserChatsCollection();

    if (!chatsCollection) {
      renderLocalHistory();
      return;
    }

    const snapshot =
      await getDocs(
        chatsCollection
      );

    const chats = [];

    snapshot.forEach(
      documentSnapshot => {

        const data =
          documentSnapshot.data();

        chats.push({

          id:
            documentSnapshot.id,

          title:
            data.title ||
            "New conversation",

          messages:
            data.messages || [],

          createdAt:
            data.createdAt ||
            "",

          updatedAt:
            data.updatedAt ||
            ""

        });

      }
    );

    chats.sort(
      (a, b) =>
        new Date(
          b.updatedAt ||
          b.createdAt ||
          0
        ) -
        new Date(
          a.updatedAt ||
          a.createdAt ||
          0
        )
    );

    renderHistoryFromChats(
      chats
    );

  } catch (error) {

    console.error(
      "Firestore history error:",
      error
    );

    renderLocalHistory();

  }

}


/* =========================
   RENDER HISTORY
========================= */

function renderHistoryFromChats(
  chats
) {

  history.innerHTML = "";

  chats.forEach(
    chat => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "historyItem";

      item.textContent =
        chat.title ||
        "New conversation";

      item.addEventListener(
        "click",
        () => {

          loadCloudChat(
            chat
          );

          sidebar.classList.remove(
            "open"
          );

        }
      );

      history.appendChild(
        item
      );

    }
  );

}


function renderLocalHistory() {

  history.innerHTML = "";

  const chats =
    getChats();

  chats
    .slice()
    .reverse()
    .forEach(
      (chat, index) => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "historyItem";

        item.textContent =
          chat.title ||
          "New conversation";

        item.addEventListener(
          "click",
          () => {

            loadLocalChat(
              chats.length -
              1 -
              index
            );

          }
        );

        history.appendChild(
          item
        );

      }
    );

}


/* =========================
   SAVE LOCAL CHAT
========================= */

function saveCurrentChatLocally() {

  if (!messages.length) {
    return;
  }

  const chats =
    getChats();

  const firstUserMessage =
    messages.find(
      message =>
        message.role === "user"
    );

  const title =
    firstUserMessage
      ? firstUserMessage.content
          .replace(/\s+/g, " ")
          .slice(0, 45)
      : "New conversation";

  if (currentChatId) {

    const existingIndex =
      chats.findIndex(
        chat =>
          chat.id === currentChatId
      );

    if (existingIndex !== -1) {

      chats[existingIndex] = {

        ...chats[existingIndex],

        id:
          currentChatId,

        title,

        messages,

        updatedAt:
          new Date().toISOString()

      };

    } else {

      chats.push({

        id:
          currentChatId,

        title,

        messages,

        createdAt:
          new Date().toISOString(),

        updatedAt:
          new Date().toISOString()

      });

    }

  } else {

    const localId =
      "local-" +
      Date.now();

    currentChatId =
      localId;

    chats.push({

      id:
        localId,

      title,

      messages,

      createdAt:
        new Date().toISOString(),

      updatedAt:
        new Date().toISOString()

    });

  }

  saveChats(chats);

}


/* =========================
   SAVE CHAT
========================= */

async function saveCurrentChat() {

  if (!messages.length) {
    return;
  }

  saveCurrentChatLocally();

  await saveChatToCloud();

  await loadCloudHistory();

}


/* =========================
   LOAD LOCAL CHAT
========================= */

function loadLocalChat(index) {

  const chats =
    getChats();

  const chat =
    chats[index];

  if (!chat) {
    return;
  }

  currentChatId =
    chat.id ||
    null;

  messages =
    chat.messages || [];

  renderMessages();

}


/* =========================
   LOAD CLOUD CHAT
========================= */

function loadCloudChat(chat) {

  currentChatId =
    chat.id;

  messages =
    chat.messages || [];

  renderMessages();

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages() {

  chatInner.innerHTML = "";

  if (!messages.length) {

    const newWelcome =
      document.createElement(
        "div"
      );

    newWelcome.className =
      "welcome";

    newWelcome.innerHTML = `
      <h1>How can I help you?</h1>
      <p>Ask Zed AI anything.</p>
    `;

    chatInner.appendChild(
      newWelcome
    );

    return;

  }

  messages.forEach(
    message => {

      if (
        message.content ===
        "[Generated image]"
      ) {

        addMessageToScreen(
          "assistant",
          "🖼️ Generated image"
        );

      } else {

        addMessageToScreen(
          message.role,
          message.content
        );

      }

    }
  );

  scrollToBottom();

}

   NEW CHAT
========================= */

   CHAT DISPLAY
========================= */

/* =========================
   FILE READING
========================= */

async function readFileAsDataURL(
  file
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload = () =>
        resolve(
          reader.result
        );

      reader.onerror = () =>
        reject(
          new Error(
            "Could not read the selected file."
          )
        );

      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================
   FILE SELECTION
========================= */

function showSelectedFile(
  file
) {

  if (!file) {
    return;
  }

  selectedFile =
    file;

  filePreviewName.textContent =
    file.name;

  filePreview.classList.add(
    "show"
  );

}

fileInput.addEventListener(

removeFile.addEventListener(

/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  const text =
    input.value.trim();

  if (
    !text &&
    !selectedFile
  ) {
    return;
  }

  const fileToSend =
    selectedFile;

  let displayText =
    text;

  if (fileToSend) {

    if (displayText) {

      displayText +=
        "\n\n📎 " +
        fileToSend.name;

    } else {

      displayText =
        "📎 " +
        fileToSend.name;

    }

  }

  messages.push({

    role:
      "user",

    content:
      displayText

  });

  addMessageToScreen(
    "user",
    displayText
  );

  input.value = "";

  input.style.height =
    "auto";

  scrollToBottom();

  status.textContent =
    fileToSend
      ? "Preparing your file..."
      : "Zed AI is thinking...";

  send.disabled =
    true;

  try {

    let filePayload =
      null;

    if (fileToSend) {

      const maxFileSize =
        15 * 1024 * 1024;

      const allowedTypes = [

        "application/pdf",

        "image/jpeg",

        "image/png",

        "image/webp",

        "image/gif"

      ];

      if (
        fileToSend.size >
        maxFileSize
      ) {

        throw new Error(
          "The file is too large. Maximum size is 15 MB."
        );

      }

      if (
        !allowedTypes.includes(
          fileToSend.type
        )
      ) {

        throw new Error(
          "Zed AI currently supports JPG, PNG, WEBP, GIF images and PDF files."
        );

      }

      status.textContent =
        "Reading " +
        fileToSend.name +
        "...";

      const dataUrl =
        await readFileAsDataURL(
          fileToSend
        );

      filePayload = {

        name:
          fileToSend.name,

        mimeType:
          fileToSend.type,

        data:
          dataUrl

      };

    }

    status.textContent =
      fileToSend
        ? "Zed AI is analyzing your file..."
        : "Zed AI is thinking...";

    const response =
      await fetch(
        "/api/chat",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              message:
                text,

              userId,

              memories,

              conversation:
                messages
                  .slice(0, -1)
                  .map(
                    message => ({

                      role:
                        message.role,

                      text:
                        message.content

                    })
                  ),

              file:
                filePayload

            })

        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Request failed."
      );

    }

    const reply =
      data.reply ||
      data.message ||
      "I couldn't generate a response.";

    messages.push({

      role:
        "assistant",

      content:
        reply

    });

    addMessageToScreen(
      "assistant",
      reply
    );

    await saveCurrentChat();

    if (fileToSend) {

      selectedFile =
        null;

      photoInput.value =
        "";

      fileInput.value =
        "";

      filePreview.classList.remove(
        "show"
      );

    }

  } catch (error) {

    console.error(
      error
    );

    const errorMessage =
      error.message ||
      "Sorry, something went wrong. Please try again.";

    messages.push({

      role:
        "assistant",

      content:
        errorMessage

    });

    addMessageToScreen(
      "assistant",
      errorMessage
    );

    await saveCurrentChat();

  } finally {

    status.textContent =
      "";

    send.disabled =
      false;

    scrollToBottom();

  }

}


/* =========================
   SEND BUTTON
========================= */

send.addEventListener(
  "click",
  sendMessage
);


/* =========================
   ENTER KEY
========================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

    }

  }
);

========================= */

    input.style.height =
      "auto";

========================= */

attachButton.addEventListener(

    );

  }
);

  }
);


fileButton.addEventListener(

  }
);


/* =========================
   CREATE IMAGE
========================= */

imageButton.addEventListener(
  "click",
  async () => {

    attachMenu.classList.remove(
      "show"
    );

    const prompt =
      input.value.trim();

    if (!prompt) {

      alert(
        "Please type a description of the image you want to create."
      );

      input.focus();

      return;

    }

    status.textContent =
      "Creating your image...";

    send.disabled =
      true;

    try {

      const response =
        await fetch(
          "/api/generate-image",
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                prompt

              })

          }
        );

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.error ||
          "Image generation failed."
        );

      }

      if (
        data.image ||
        data.imageUrl
      ) {

        const imagePrompt =
          "🎨 Create image: " +
          prompt;

        messages.push({

          role:
            "user",

          content:
            imagePrompt

        });

        addMessageToScreen(
          "user",
          imagePrompt
        );

        const imageMessage =
          document.createElement(
            "div"
          );

        imageMessage.className =
          "message assistant";

        const bubble =
          document.createElement(
            "div"
          );

        bubble.className =
          "messageBubble";

        const image =
          document.createElement(
            "img"
          );

        image.src =
          data.image ||
          data.imageUrl;

        image.style.maxWidth =
          "100%";

        image.style.borderRadius =
          "12px";

        bubble.appendChild(
          image
        );

        imageMessage.appendChild(
          bubble
        );

        chatInner.appendChild(
          imageMessage
        );

        messages.push({

          role:
            "assistant",

          content:
            "[Generated image]"

        });

        await saveCurrentChat();

        input.value = "";

      } else {

        throw new Error(
          "The server did not return an image."
        );

      }

    } catch (error) {

      console.error(
        error
      );

      addMessageToScreen(
        "assistant",
        error.message ||
        "Sorry, I couldn't create the image."
      );

    } finally {

      status.textContent =
        "";

      send.disabled =
        false;

      scrollToBottom();

    }

  }
);


/* =========================
   VOICE INPUT
========================= */

let recognition =
  null;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.lang =
    "en-US";

  recognition.onstart =
    () => {

      mic.textContent =
        "🟢";

      status.textContent =
        "Listening...";

    };

  recognition.onend =
    () => {

      mic.textContent =
        "🎙️";

      status.textContent =
        "";

    };

  recognition.onresult =
    event => {

      const transcript =
        event.results[0][0].transcript;

      input.value =
        transcript;

      input.dispatchEvent(
        new Event("input")
      );

    };

  recognition.onerror =
    error => {

      console.error(
        "Speech recognition error:",
        error
      );

      mic.textContent =
        "🎙️";

      status.textContent =
        "";

    };

  mic.addEventListener(
    "click",
    () => {

      try {

        recognition.start();

      } catch (error) {

        console.error(
          error
        );

      }

    }
  );

} else {

  mic.addEventListener(
    "click",
    () => {

      alert(
        "Voice input is not supported by this browser."
      );

    }
  );

}


/* =========================
   NEW CHAT
========================= */

newChatButton.addEventListener(
  "click",
  () => {

    newChat();

    sidebar.classList.remove(
      "open"
    );

  }
);


/* =========================
   MOBILE MENU
========================= */

menuButton.addEventListener(
  "click",
  () => {

    sidebar.classList.toggle(
      "open"
    );

  }
);


/* =========================
   ACCOUNT
========================= */

function showAccount(user) {

  accountBox.style.display =
    "block";

  userName.textContent =
    user.displayName ||
    "Zed AI User";

  userEmail.textContent =
    user.email ||
    "";

  userPhoto.src =
    user.photoURL ||
    "https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/anonymous.png";

}


function hideAccount() {

  accountBox.style.display =
    "none";

}


/* =========================
   LOGOUT
========================= */

logoutButton.addEventListener(
  "click",
  async () => {

    try {

      if (auth) {

        await signOut(
          auth
        );

      }

    } catch (error) {

      console.error(
        "Logout error:",
        error
      );

    }

  }
);


/* =========================
   AUTH ERROR
========================= */

function showAuthError(
  error
) {

  console.error(
    error
  );

  let message =
    "Something went wrong.";

  if (
    error &&
    error.code ===
      "auth/invalid-credential"
  ) {

    message =
      "Incorrect email or password.";

  } else if (
    error &&
    error.code ===
      "auth/email-already-in-use"
  ) {

    message =
      "This email is already registered.";

  } else if (
    error &&
    error.code ===
      "auth/weak-password"
  ) {

    message =
      "Password should be at least 6 characters.";

  } else if (
    error &&
    error.code ===
      "auth/popup-closed-by-user"
  ) {

    message =
      "Google sign-in was cancelled.";

  } else if (
    error &&
    error.message
  ) {

    message =
      error.message;

  }

  authError.textContent =
    message;

}


/* =========================
   GOOGLE LOGIN
========================= */

googleLogin.addEventListener(
  "click",
  async () => {

    authError.textContent =
      "";

    if (!auth) {

      authError.textContent =
        "Firebase is not configured.";

      return;

    }

    try {

      await signInWithPopup(
        auth,
        googleProvider
      );

    } catch (error) {

      showAuthError(
        error
      );

    }

  }
);


/* =========================
   EMAIL LOGIN
========================= */

emailLogin.addEventListener(
  "click",
  async () => {

    authError.textContent =
      "";

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if (
      !email ||
      !password
    ) {

      authError.textContent =
        "Please enter your email and password.";

      return;

    }

    if (!auth) {

      authError.textContent =
        "Firebase is not configured.";

      return;

    }

    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    } catch (error) {

      showAuthError(
        error
      );

    }

  }
);


/* =========================
   CREATE ACCOUNT
========================= */

createAccount.addEventListener(
  "click",
  async () => {

    authError.textContent =
      "";

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if (
      !email ||
      !password
    ) {

      authError.textContent =
        "Please enter your email and password.";

      return;

    }

    if (!auth) {

      authError.textContent =
        "Firebase is not configured.";

      return;

    }

    try {

      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    } catch (error) {

      showAuthError(
        error
      );

    }

  }
);


/* =========================
   AUTH STATE
========================= */

if (auth) {

  onAuthStateChanged(
    auth,
    async user => {

      if (user) {

        userId =
          user.uid;

        showAccount(
          user
        );

        authScreen.style.display =
          "none";

        app.style.display =
          "flex";

        messages = [];

        currentChatId = null;

        await loadCloudHistory();

      } else {

        userId =
          "guest";

        currentChatId =
          null;

        messages = [];

        hideAccount();

        authScreen.style.display =
          "flex";

        app.style.display =
          "flex";

        renderLocalHistory();

      }

    }
  );

} else {

  authScreen.style.display =
    "flex";

}


/* =========================
   INITIAL STATE
========================= */

if (!auth) {

  authScreen.style.display =
    "flex";

}

</script>

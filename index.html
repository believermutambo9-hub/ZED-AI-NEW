<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#212121">
<title>Zed AI</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#212121;
  color:#ececec;
  font-family:Arial,Helvetica,sans-serif;
}

button,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  background:#171717;
  border-right:1px solid #303030;
  padding:12px;
  display:flex;
  flex-direction:column;
  flex-shrink:0;
}

.logo-row{
  height:48px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 8px;
}

.logo{
  width:32px;
  height:32px;
  border-radius:9px;
  background:#79dda3;
  color:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:900;
}

.logo-row strong{
  font-size:18px;
}

.logo-row span{
  color:#79dda3;
}

.new-chat{
  margin:10px 0 18px;
  height:45px;
  border:1px solid #444;
  border-radius:9px;
  background:#212121;
  color:#eee;
  text-align:left;
  padding:0 13px;
}

.new-chat:hover{
  background:#2b2b2b;
}

.history-title{
  color:#888;
  font-size:12px;
  padding:7px 9px;
}

.history{
  flex:1;
  overflow-y:auto;
}

.chat-row{
  width:100%;
  min-height:42px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#ccc;
  display:flex;
  align-items:center;
  padding:0 8px;
  margin-bottom:2px;
  text-align:left;
}

.chat-row:hover,
.chat-row.active{
  background:#2b2b2b;
}

.chat-name{
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:13px;
}

.delete-chat{
  width:28px;
  height:28px;
  border:0;
  background:transparent;
  color:#777;
  border-radius:6px;
}

.delete-chat:hover{
  background:#3b3b3b;
  color:#ff7777;
}

.empty{
  color:#777;
  font-size:12px;
  padding:10px;
}

.online{
  border-top:1px solid #303030;
  padding:14px 8px 5px;
  color:#999;
  font-size:12px;
}

.online-dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#62d78b;
  margin-right:7px;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.header{
  height:58px;
  border-bottom:1px solid #303030;
  display:flex;
  align-items:center;
  padding:0 18px;
  flex-shrink:0;
}

.menu{
  display:none;
  border:0;
  background:transparent;
  color:#ddd;
  font-size:22px;
  margin-right:8px;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
}

.chat-content{
  width:min(850px,100%);
  margin:auto;
  padding:35px 20px 150px;
}

/* WELCOME */

.welcome{
  min-height:65vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.welcome-logo{
  width:62px;
  height:62px;
  border-radius:18px;
  background:#79dda3;
  color:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  font-weight:900;
  margin-bottom:20px;
}

.welcome h1{
  margin:0;
  font-size:34px;
  font-weight:600;
}

.welcome h1 span{
  color:#79dda3;
}

.welcome p{
  max-width:550px;
  color:#999;
  line-height:1.6;
  margin:12px 0 28px;
}

.cards{
  width:min(650px,100%);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  border:1px solid #3a3a3a;
  background:#292929;
  color:#ddd;
  border-radius:10px;
  padding:15px;
  text-align:left;
}

.card:hover{
  background:#333;
}

.card strong{
  display:block;
  margin-bottom:5px;
  font-size:13px;
}

.card small{
  color:#888;
}

/* MESSAGES */

.message{
  display:flex;
  gap:14px;
  margin:25px 0;
}

.avatar{
  width:32px;
  height:32px;
  border-radius:9px;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-shrink:0;
  font-size:12px;
  font-weight:bold;
}

.avatar.ai{
  background:#79dda3;
  color:#111;
}

.avatar.user{
  background:#444;
  color:#eee;
}

.message-body{
  flex:1;
  min-width:0;
}

.message-name{
  font-size:13px;
  font-weight:bold;
  margin:2px 0 7px;
}

.message-text{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.7;
  font-size:15px;
}

/* THINKING */

.thinking{
  display:flex;
  gap:5px;
  padding:7px 0;
}

.thinking span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#aaa;
  animation:pulse 1.2s infinite;
}

.thinking span:nth-child(2){
  animation-delay:.15s;
}

.thinking span:nth-child(3){
  animation-delay:.3s;
}

@keyframes pulse{
  0%,60%,100%{
    opacity:.3;
    transform:translateY(0);
  }
  30%{
    opacity:1;
    transform:translateY(-4px);
  }
}

/* COMPOSER */

.composer-area{
  position:absolute;
  left:270px;
  right:0;
  bottom:0;
  padding:18px 20px 12px;
  background:linear-gradient(
    transparent,
    #212121 30%
  );
}

.composer{
  width:min(850px,100%);
  margin:auto;
  border:1px solid #444;
  background:#2f2f2f;
  border-radius:17px;
  padding:8px 9px 8px 14px;
  display:flex;
  align-items:flex-end;
}

.input{
  flex:1;
  min-width:0;
  min-height:44px;
  max-height:180px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:10px 5px;
  line-height:1.5;
}

.input::placeholder{
  color:#888;
}

.send{
  width:40px;
  height:40px;
  border:0;
  border-radius:10px;
  background:#79dda3;
  color:#111;
  font-size:20px;
  font-weight:bold;
}

.send:hover{
  background:#94edb6;
}

.send:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.disclaimer{
  text-align:center;
  color:#666;
  font-size:10px;
  margin-top:7px;
}

/* MOBILE */

@media(max-width:750px){

  .sidebar{
    position:fixed;
    top:0;
    bottom:0;
    left:-280px;
    z-index:100;
    transition:left .2s;
    box-shadow:10px 0 40px #0008;
  }

  .sidebar.open{
    left:0;
  }

  .menu{
    display:block;
  }

  .composer-area{
    left:0;
    padding:10px;
  }

  .chat-content{
    padding:20px 13px 145px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .welcome h1{
    font-size:28px;
  }

  .message{
    gap:10px;
  }

  .message-text{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="logo-row">
      <div class="logo">Z</div>
      <strong>Zed <span>AI</span></strong>
    </div>

    <button class="new-chat" id="newChat">
      ＋ New chat
    </button>

    <div class="history-title">
      Recent chats
    </div>

    <div class="history" id="history"></div>

    <div class="online">
      <span class="online-dot"></span>
      Zed AI is online
    </div>

  </aside>

  <main class="main">

    <header class="header">
      <button class="menu" id="menu">☰</button>
      <strong id="headerTitle">Zed AI</strong>
    </header>

    <section class="chat" id="chat">

      <div class="chat-content" id="chatContent"></div>

    </section>

    <div class="composer-area">

      <div class="composer">

        <textarea
          id="input"
          class="input"
          rows="1"
          placeholder="Message Zed AI..."
        ></textarea>

       <button
  id="imageButton"
  class="send"
  type="button"
  title="Create image"
>🎨</button>

<button
  id="send"
  class="send"
  type="button"
  title="Send message"
>↑</button>

      </div>

      <div class="disclaimer">
        Zed AI can make mistakes. Check important information.
      </div>

    </div>

  </main>

</div>

<script>
"use strict";

const input = document.getElementById("input");
const send = document.getElementById("send");
const imageButton = document.getElementById("imageButton"); 
const chatContent = document.getElementById("chatContent");
const chat = document.getElementById("chat");
const history = document.getElementById("history");
const newChatButton = document.getElementById("newChat");
const menu = document.getElementById("menu");
const sidebar = document.getElementById("sidebar");
const headerTitle = document.getElementById("headerTitle");

const STORAGE = "zed_ai_chats_final";

let chats = [];
let currentId = null;
let messages = [];
let busy = false;


/* STORAGE */

function save(){
  try{
    localStorage.setItem(
      STORAGE,
      JSON.stringify(chats)
    );
  }catch(e){
    console.log("Storage error:",e);
  }
}

function load(){

  try{
    const data =
      localStorage.getItem(STORAGE);

    if(data){
      chats = JSON.parse(data);
    }

    if(!Array.isArray(chats)){
      chats = [];
    }

  }catch(e){
    chats = [];
  }
}


/* TITLE */

function makeTitle(text){

  const clean =
    text.replace(/\s+/g," ").trim();

  return clean.length > 35
    ? clean.substring(0,35) + "..."
    : clean;

}


/* CHAT CREATION */

function createChat(){

  const now = Date.now();

  const chatObject = {
    id:String(now),
    title:"New chat",
    messages:[],
    createdAt:now,
    updatedAt:now
  };

  chats.unshift(chatObject);

  currentId =
    chatObject.id;

  messages = [];

  save();
  renderHistory();
  updateHeader();
  render();

}


function getChat(){

  return chats.find(
    item => item.id === currentId
  );

}


function ensureChat(){

  let item = getChat();

  if(!item){
    createChat();
    item = getChat();
  }

  return item;

}


/* HISTORY */

function renderHistory(){

  history.innerHTML = "";

  if(chats.length === 0){

    history.innerHTML =
      '<div class="empty">No conversations yet.</div>';

    return;
  }

  chats
    .slice()
    .sort(
      (a,b) =>
        (b.updatedAt || 0) -
        (a.updatedAt || 0)
    )
    .forEach(item => {

      const row =
        document.createElement("div");

      row.className =
        "chat-row" +
        (item.id === currentId
          ? " active"
          : "");

      const name =
        document.createElement("div");

      name.className =
        "chat-name";

      name.textContent =
        item.title || "New chat";

      name.addEventListener(
        "click",
        () => openChat(item.id)
      );

      const del =
        document.createElement("button");

      del.className =
        "delete-chat";

      del.textContent =
        "×";

      del.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          removeChat(item.id);

        }
      );

      row.appendChild(name);
      row.appendChild(del);

      history.appendChild(row);

    });

}


/* OPEN */

function openChat(id){

  const item =
    chats.find(
      chat => chat.id === id
    );

  if(!item){
    return;
  }

  currentId = item.id;

  messages =
    Array.isArray(item.messages)
      ? item.messages
      : [];

  updateHeader();
  renderHistory();
  render();

  sidebar.classList.remove("open");

}


/* DELETE */

function removeChat(id){

  if(!confirm("Delete this conversation?")){
    return;
  }

  chats =
    chats.filter(
      item => item.id !== id
    );

  if(currentId === id){

    currentId = null;
    messages = [];

    if(chats.length){

      const latest =
        chats
          .slice()
          .sort(
            (a,b) =>
              (b.updatedAt || 0) -
              (a.updatedAt || 0)
          )[0];

      currentId =
        latest.id;

      messages =
        latest.messages || [];

    }

  }

  save();
  renderHistory();
  updateHeader();
  render();

}


/* SAVE CURRENT */

function saveCurrent(){

  const item =
    getChat();

  if(!item){
    return;
  }

  item.messages =
    messages.map(
      message => ({
        role:message.role,
        text:message.text
      })
    );

  item.updatedAt =
    Date.now();

  const first =
    messages.find(
      message =>
        message.role === "user"
    );

  if(first){
    item.title =
      makeTitle(first.text);
  }

  save();
  renderHistory();
  updateHeader();

}


/* HEADER */

function updateHeader(){

  const item =
    getChat();

  headerTitle.textContent =
    item?.title || "Zed AI";

}


/* WELCOME */

function welcome(){

  chatContent.innerHTML = `
    <div class="welcome">

      <div class="welcome-logo">Z</div>

      <h1>How can <span>Zed AI</span> help?</h1>

      <p>
        Ask me anything. I can help with business,
        writing, studying, ideas, CVs and everyday questions.
      </p>

      <div class="cards">

        <button class="card"
          data-text="Help me create a professional CV.">
          <strong>📄 Create a CV</strong>
          <small>Build a professional CV.</small>
        </button>

        <button class="card"
          data-text="Give me realistic business ideas I can start in Zambia with a small budget.">
          <strong>💼 Business ideas</strong>
          <small>Find practical business opportunities.</small>
        </button>

        <button class="card"
          data-text="Teach me something interesting in a simple way.">
          <strong>📚 Learn something</strong>
          <small>Understand difficult topics easily.</small>
        </button>

        <button class="card"
          data-text="Help me write a professional message.">
          <strong>✍️ Writing</strong>
          <small>Improve your writing.</small>
        </button>

      </div>

    </div>
  `;

  document
    .querySelectorAll(".card")
    .forEach(card => {

      card.addEventListener(
        "click",
        () => {

          input.value =
            card.dataset.text;

          resize();

          input.focus();

        }
      );

    });

}


/* RENDER */

function render(){

  chatContent.innerHTML = "";

  if(messages.length === 0){

    welcome();

    return;
  }

  messages.forEach(
    message => {

      addMessage(
        message.text,
        message.role
      );

    }
  );

  scroll();

}


/* ADD MESSAGE */

function addMessage(text,role){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message";

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar " +
    (role === "user"
      ? "user"
      : "ai");

  avatar.textContent =
    role === "user"
      ? "You"
      : "Z";

  const body =
    document.createElement("div");

  body.className =
    "message-body";

  const name =
    document.createElement("div");

  name.className =
    "message-name";

  name.textContent =
    role === "user"
      ? "You"
      : "Zed AI";

  const textElement =
    document.createElement("div");

  textElement.className =
    "message-text";

  textElement.textContent =
    text;

  body.appendChild(name);
  body.appendChild(textElement);

  wrapper.appendChild(avatar);
  wrapper.appendChild(body);

  chatContent.appendChild(wrapper);

}


/* THINKING */

function thinking(){

  const element =
    document.createElement("div");

  element.className =
    "message";

  element.id =
    "thinking";

  element.innerHTML = `
    <div class="avatar ai">Z</div>

    <div class="message-body">

      <div class="message-name">Zed AI</div>

      <div class="thinking">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>
  `;

  chatContent.appendChild(element);

  scroll();

}


function removeThinking(){

  const element =
    document.getElementById("thinking");

  if(element){
    element.remove();
  }

}

/* IMAGE GENERATION */

async function generateImage(){

  if(busy){
    return;
  }

  const prompt =
    input.value.trim();

  if(!prompt){
    alert("Describe the image you want me to create.");
    input.focus();
    return;
  }

  ensureChat();

  busy = true;
  send.disabled = true;
  imageButton.disabled = true;

  input.value = "";
  resize();

  messages.push({
    role:"user",
    text:"🎨 Create an image: " + prompt
  });

  render();
  saveCurrent();
  thinking();

  try{

    const response =
      await fetch(
        "/api/generate-image",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            prompt:prompt
          })
        }
      );

    const raw =
      await response.text();

    let data;

    try{
      data = JSON.parse(raw);
    }catch{
      throw new Error(
        "Invalid response from image server."
      );
    }

    removeThinking();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Image generation failed."
      );

    }

    const imageData =
      data?.data?.output?.find(
        item => item.type === "image"
      )?.data;

    if(!imageData){

      throw new Error(
        "No image was returned."
      );

    }

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message";

    wrapper.innerHTML = `
      <div class="avatar ai">Z</div>

      <div class="message-body">

        <div class="message-name">
          Zed AI
        </div>

        <div class="message-text">
          <p>Here is your image:</p>

          <img
            src="data:image/png;base64,${imageData}"
            alt="${prompt.replace(/"/g,"&quot;")}"
            style="
              max-width:100%;
              border-radius:14px;
              display:block;
              margin-top:10px;
            "
          >
        </div>

      </div>
    `;

    chatContent.appendChild(wrapper);

    scroll();

    saveCurrent();

  }catch(error){

    removeThinking();

    addMessage(
      "Sorry, I couldn't generate the image. " +
      error.message,
      "assistant"
    );

    console.error(
      "Image generation error:",
      error
    );

  }finally{

    busy = false;
    send.disabled = false;
    imageButton.disabled = false;

    input.focus();

  }

}
/* SEND */

async function sendMessage(){

  if(busy){
    return;
  }

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  ensureChat();

  busy = true;
  send.disabled = true;

  input.value = "";

  resize();

  messages.push({
    role:"user",
    text:text
  });

  render();

  saveCurrent();

  thinking();

  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            message:text
          })
        }
      );

    const raw =
      await response.text();

    let data;

    try{
      data = JSON.parse(raw);
    }catch{
      throw new Error(
        "Invalid response from server."
      );
    }

    removeThinking();

    if(!response.ok){

      throw new Error(
        data.error ||
        "AI service unavailable."
      );

    }

    const reply =
      String(data.reply || "").trim();

    if(!reply){

      throw new Error(
        "Zed AI returned no answer."
      );

    }

    messages.push({
      role:"assistant",
      text:reply
    });

    render();

    saveCurrent();

  }catch(error){

    removeThinking();

    addMessage(
      "Sorry, I couldn't get a response. " +
      error.message,
      "assistant"
    );

    console.error(
      "Zed AI request error:",
      error
    );

  }finally{

    busy = false;
    send.disabled = false;

    input.focus();

  }

}


/* INPUT */

function resize(){

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      180
    ) + "px";

}


input.addEventListener(
  "input",
  resize
);

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* BUTTONS */

send.addEventListener(
  "click",
  sendMessage
);
imageButton.addEventListener(
  "click",
  generateImage
);
newChatButton.addEventListener(
  "click",
  () => {

    createChat();

    input.value = "";

    resize();

    input.focus();

  }
);

menu.addEventListener(
  "click",
  () => {

    sidebar.classList.toggle(
      "open"
    );

  }
);


/* START */

load();

if(chats.length){

  const latest =
    chats
      .slice()
      .sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      )[0];

  currentId =
    latest.id;

  messages =
    Array.isArray(latest.messages)
      ? latest.messages
      : [];

}else{

  currentId = null;
  messages = [];

}

renderHistory();
updateHeader();
render();

input.focus();

</script>

</body>
</html>

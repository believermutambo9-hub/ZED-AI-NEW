<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<title>Zed AI</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#080b12;
  --panel:#0e131d;
  --panel2:#111824;
  --border:#202938;
  --text:#f4f7fb;
  --muted:#8994a6;
  --accent:#72e6a4;
  --accent2:#42c77e;
  --user:#173b2a;
  --danger:#ff6b6b;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  display:flex;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  flex-shrink:0;
  background:#0b0f17;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:5px 5px 20px;
}

.brand-logo{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),#36b875);
  color:#07120b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:19px;
}

.brand-name{
  font-weight:850;
  font-size:20px;
  letter-spacing:-.5px;
}

.brand-name span{
  color:var(--accent);
}

.new-chat{
  width:100%;
  border:1px solid #2c394b;
  background:#111722;
  color:white;
  border-radius:12px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
  margin-bottom:22px;
}

.new-chat:hover{
  background:#17202d;
}

.side-title{
  color:#667286;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:0 7px 9px;
}

.tool-link{
  border:0;
  background:transparent;
  color:#cbd3df;
  width:100%;
  text-align:left;
  padding:11px 9px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:3px;
}

.tool-link:hover{
  background:#141b26;
  color:white;
}

.tool-icon{
  width:30px;
  height:30px;
  border-radius:8px;
  background:#151e2b;
  display:flex;
  align-items:center;
  justify-content:center;
}

.history{
  margin-top:20px;
  flex:1;
  overflow:auto;
}

.history-item{
  color:#8c98aa;
  font-size:13px;
  padding:9px;
  border-radius:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#121923;
  color:#dce3ec;
}

.side-bottom{
  border-top:1px solid var(--border);
  padding-top:14px;
}

.status{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px;
  color:#a8b2c1;
  font-size:13px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px #72e6a4;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% -20%,#183b2a 0,transparent 35%),
    var(--bg);
}

.topbar{
  height:65px;
  flex-shrink:0;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  background:rgba(8,11,18,.78);
  backdrop-filter:blur(15px);
}

.top-title{
  display:flex;
  flex-direction:column;
}

.top-title strong{
  font-size:14px;
}

.top-title span{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:36px;
  height:36px;
  border:1px solid var(--border);
  background:#101621;
  color:#cbd3df;
  border-radius:10px;
}

.icon-btn:hover{
  background:#18212e;
}

.chat-area{
  flex:1;
  overflow-y:auto;
  padding:40px 20px 20px;
}

.chat-inner{
  width:min(850px,100%);
  margin:auto;
}

/* WELCOME */

.welcome{
  min-height:55vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px 10px;
}

.welcome-logo{
  width:64px;
  height:64px;
  border-radius:20px;
  background:linear-gradient(135deg,var(--accent),#39bd79);
  color:#06130b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:28px;
  box-shadow:0 15px 50px #72e6a426;
  margin-bottom:22px;
}

.welcome h1{
  font-size:clamp(34px,6vw,58px);
  margin:0;
  letter-spacing:-2px;
}

.welcome h1 span{
  color:var(--accent);
}

.welcome p{
  color:var(--muted);
  max-width:580px;
  line-height:1.6;
  margin:13px auto 30px;
}

.suggestions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
  width:min(680px,100%);
}

.suggestion{
  text-align:left;
  background:#0e141e;
  border:1px solid var(--border);
  color:#d8e0ea;
  border-radius:14px;
  padding:15px;
  transition:.2s;
}

.suggestion:hover{
  transform:translateY(-2px);
  border-color:#365844;
  background:#121a24;
}

.suggestion strong{
  display:block;
  font-size:13px;
  margin-bottom:5px;
}

.suggestion span{
  color:#748094;
  font-size:12px;
}

/* MESSAGES */

.message{
  display:flex;
  margin:22px 0;
  gap:12px;
}

.avatar{
  width:34px;
  height:34px;
  flex-shrink:0;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:800;
}

.avatar.ai{
  background:var(--accent);
  color:#07130b;
}

.avatar.user{
  background:#263142;
  color:#dbe3ed;
}

.message-content{
  min-width:0;
  max-width:calc(100% - 50px);
}

.message-name{
  color:#8e9bad;
  font-size:11px;
  font-weight:700;
  margin-bottom:5px;
}

.message-text{
  color:#e2e7ee;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user-message .message-text{
  background:var(--user);
  border-radius:4px 15px 15px 15px;
  padding:12px 14px;
}

/* COMPOSER */

.composer-wrap{
  flex-shrink:0;
  padding:12px 20px 18px;
  background:linear-gradient(transparent,var(--bg) 25%);
}

.composer{
  width:min(850px,100%);
  margin:auto;
  background:#101620;
  border:1px solid #293443;
  border-radius:18px;
  padding:10px;
  box-shadow:0 12px 50px #0007;
}

.input{
  width:100%;
  min-height:48px;
  max-height:130px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:10px 10px 5px;
}

.input::placeholder{
  color:#657185;
}

.composer-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:5px 3px 2px;
}

.hint{
  color:#5f6b7d;
  font-size:11px;
}

.send{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:#06120b;
  font-size:18px;
  font-weight:900;
}

.send:hover{
  background:#8af0b5;
}

.send:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.disclaimer{
  text-align:center;
  color:#4f5a6b;
  font-size:10px;
  margin-top:9px;
}

/* THINKING */

.thinking{
  display:flex;
  gap:5px;
  padding:5px 0;
}

.thinking span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#8491a3;
  animation:bounce 1.2s infinite;
}

.thinking span:nth-child(2){
  animation-delay:.15s;
}

.thinking span:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,60%,100%{transform:translateY(0);opacity:.4}
  30%{transform:translateY(-5px);opacity:1}
}

/* MOBILE */

.mobile-menu{
  display:none;
}

@media(max-width:800px){

  .sidebar{
    position:fixed;
    z-index:20;
    left:-290px;
    top:0;
    bottom:0;
    transition:.25s;
    box-shadow:20px 0 50px #0009;
  }

  .sidebar.open{
    left:0;
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 13px;
  }

  .chat-area{
    padding:20px 12px;
  }

  .composer-wrap{
    padding:8px 10px 12px;
  }

  .suggestions{
    grid-template-columns:1fr;
  }

  .welcome{
    min-height:60vh;
  }

  .welcome h1{
    font-size:38px;
  }
}

@media(max-width:480px){

  .hint{
    display:none;
  }

  .composer{
    border-radius:15px;
  }

  .message{
    margin:17px 0;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-logo">Z</div>
      <div class="brand-name">Zed <span>AI</span></div>
    </div>

    <button class="new-chat" onclick="newChat()">
      <span>＋</span>
      New chat
    </button>

    <div class="side-title">Tools</div>

    <button class="tool-link" onclick="useTool('Help me create a professional CV.')">
      <span class="tool-icon">📄</span>
      <span>CV Maker</span>
    </button>

    <button class="tool-link" onclick="useTool('Give me realistic business ideas I can start in Zambia with a small budget.')">
      <span class="tool-icon">💼</span>
      <span>Business</span>
    </button>

    <button class="tool-link" onclick="useTool('Help me write a professional message.')">
      <span class="tool-icon">✍️</span>
      <span>Writing</span>
    </button>

    <button class="tool-link" onclick="useTool('Explain this topic to me in a simple way.')">
      <span class="tool-icon">📚</span>
      <span>Study</span>
    </button>

    <div class="history">
      <div class="side-title">Recent chats</div>
      <div id="historyList"></div>
    </div>

    <div class="side-bottom">
      <div class="status">
        <span class="status-dot"></span>
        Zed AI is online
      </div>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <div style="display:flex;align-items:center;gap:10px">

        <button class="icon-btn mobile-menu" onclick="toggleSidebar()">☰</button>

        <div class="top-title">
          <strong>Zed AI</strong>
          <span>Intelligent assistant</span>
        </div>

      </div>

      <div class="top-actions">
        <button class="icon-btn" onclick="newChat()" title="New chat">＋</button>
        <button class="icon-btn" onclick="clearChat()" title="Clear chat">⌫</button>
      </div>

    </header>

    <section class="chat-area" id="chatArea">

      <div class="chat-inner" id="chatInner">

        <div class="welcome" id="welcome">

          <div class="welcome-logo">Z</div>

          <h1>Meet <span>Zed AI</span></h1>

          <p>
            Your intelligent assistant for ideas, business,
            writing, studying, CVs and everyday questions.
          </p>

          <div class="suggestions">

            <button class="suggestion"
              onclick="useTool('Help me create a professional CV from my education, skills and work experience.')">
              <strong>📄 Create a CV</strong>
              <span>Build a professional CV step by step.</span>
            </button>

            <button class="suggestion"
              onclick="useTool('Give me 5 realistic businesses I can start in Zambia with a small budget.')">
              <strong>💼 Business ideas</strong>
              <span>Find practical ideas and strategies.</span>
            </button>

            <button class="suggestion"
              onclick="useTool('Help me write a professional message.')">
              <strong>✍️ Improve my writing</strong>
              <span>Write clearer and more professional messages.</span>
            </button>

            <button class="suggestion"
              onclick="useTool('Teach me something interesting in a simple way.')">
              <strong>📚 Learn something</strong>
              <span>Understand difficult topics more easily.</span>
            </button>

          </div>

        </div>

      </div>

    </section>

    <div class="composer-wrap">

      <div class="composer">

        <textarea
          id="input"
          class="input"
          rows="1"
          placeholder="Message Zed AI..."
        ></textarea>

        <div class="composer-bottom">

          <div class="hint">
            Enter to send • Shift + Enter for new line
          </div>

          <button id="send" class="send" onclick="sendMessage()">
            ↑
          </button>

        </div>

      </div>

      <div class="disclaimer">
        Zed AI can make mistakes. Check important information.
      </div>

    </div>

  </main>

</div>

<script>

const input = document.getElementById("input");
const send = document.getElementById("send");
const chatInner = document.getElementById("chatInner");
const chatArea = document.getElementById("chatArea");
const welcome = document.getElementById("welcome");
const historyList = document.getElementById("historyList");
const sidebar = document.getElementById("sidebar");

let messages = [];
let chatHistory = [];

function toggleSidebar(){
  sidebar.classList.toggle("open");
}

function closeSidebar(){
  sidebar.classList.remove("open");
}

function useTool(text){
  input.value = text;
  input.focus();
  autoResize();
  closeSidebar();
}

function addMessage(text, type){

  if(welcome){
    welcome.remove();
  }

  const wrapper = document.createElement("div");
  wrapper.className = "message " + (type === "user" ? "user-message" : "ai-message");

  const avatar = document.createElement("div");
  avatar.className = "avatar " + type;
  avatar.textContent = type === "user" ? "You" : "Z";

  const content = document.createElement("div");
  content.className = "message-content";

  const name = document.createElement("div");
  name.className = "message-name";
  name.textContent = type === "user" ? "You" : "Zed AI";

  const messageText = document.createElement("div");
  messageText.className = "message-text";
  messageText.textContent = text;

  content.appendChild(name);
  content.appendChild(messageText);

  wrapper.appendChild(avatar);
  wrapper.appendChild(content);

  chatInner.appendChild(wrapper);

  chatArea.scrollTop = chatArea.scrollHeight;
}

function addThinking(){

  const wrapper = document.createElement("div");
  wrapper.className = "message ai-message";
  wrapper.id = "thinking";

  const avatar = document.createElement("div");
  avatar.className = "avatar ai";
  avatar.textContent = "Z";

  const content = document.createElement("div");
  content.className = "message-content";

  const name = document.createElement("div");
  name.className = "message-name";
  name.textContent = "Zed AI";

  const dots = document.createElement("div");
  dots.className = "thinking";
  dots.innerHTML = "<span></span><span></span><span></span>";

  content.appendChild(name);
  content.appendChild(dots);

  wrapper.appendChild(avatar);
  wrapper.appendChild(content);

  chatInner.appendChild(wrapper);

  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeThinking(){
  const el = document.getElementById("thinking");
  if(el) el.remove();
}

function addHistory(text){

  const item = document.createElement("div");
  item.className = "history-item";
  item.textContent = text;

  historyList.prepend(item);

  while(historyList.children.length > 8){
    historyList.lastChild.remove();
  }
}

async function sendMessage(){

  const text = input.value.trim();

  if(!text || send.disabled) return;

  input.value = "";
  autoResize();

  addMessage(text,"user");

  messages.push({
    role:"user",
    text:text
  });

  addHistory(text);

  send.disabled = true;
  addThinking();

  try{

    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:text
      })
    });

    const raw = await response.text();

    let data;

    try{
      data = JSON.parse(raw);
    }catch{
      throw new Error("The server returned an invalid response.");
    }

    if(!response.ok){
      throw new Error(data.error || "Zed AI could not answer.");
    }

    removeThinking();

    const reply = data.reply || "I didn't receive a response.";

    addMessage(reply,"ai");

    messages.push({
      role:"assistant",
      text:reply
    });

  }catch(error){

    removeThinking();

    addMessage(
      "Sorry, I couldn't complete that request. " +
      (error.message || "Please try again."),
      "ai"
    );

  }finally{

    send.disabled = false;
    input.focus();

  }
}

function newChat(){

  chatInner.innerHTML = `
    <div class="welcome" id="welcome">

      <div class="welcome-logo">Z</div>

      <h1>Meet <span>Zed AI</span></h1>

      <p>
        Your intelligent assistant for ideas, business,
        writing, studying, CVs and everyday questions.
      </p>

      <div class="suggestions">

        <button class="suggestion"
          onclick="useTool('Help me create a professional CV.')">
          <strong>📄 Create a CV</strong>
          <span>Build a professional CV step by step.</span>
        </button>

        <button class="suggestion"
          onclick="useTool('Give me 5 realistic businesses I can start in Zambia with a small budget.')">
          <strong>💼 Business ideas</strong>
          <span>Find practical ideas and strategies.</span>
        </button>

        <button class="suggestion"
          onclick="useTool('Help me write a professional message.')">
          <strong>✍️ Improve my writing</strong>
          <span>Write clearer and more professional messages.</span>
        </button>

        <button class="suggestion"
          onclick="useTool('Teach me something interesting in a simple way.')">
          <strong>📚 Learn something</strong>
          <span>Understand difficult topics more easily.</span>
        </button>

      </div>

    </div>
  `;

  messages = [];
  closeSidebar();
  input.focus();
}

function clearChat(){
  newChat();
}

function autoResize(){

  input.style.height = "auto";

  input.style.height =
    Math.min(input.scrollHeight,130) + "px";
}

input.addEventListener("input",autoResize);

input.addEventListener("keydown",function(event){

  if(event.key === "Enter" && !event.shiftKey){

    event.preventDefault();
    sendMessage();

  }

});

</script>

</body>
</html>

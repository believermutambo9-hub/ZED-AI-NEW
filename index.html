}

/* MOBILE */
@media (max-width: 700px) {
  .sidebar {
    position: fixed;
    left: -270px;
    top: 0;
    bottom: 0;
    z-index: 100;

  .sidebar.open {
    left: 0;

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <button class="new-chat" id="newChat">
      ＋ New chat

    <div class="sidebar-title">

      <div class="header-title" id="headerTitle">

  </main>

</div>

<!-- COMPOSER -->
<div class="composer-area">

  <div class="composer">

    <textarea
      id="input"
      class="input"
      rows="1"
      placeholder="Message Zed AI..."
    ></textarea>

    <button
      id="imageButton"
      class="send"
      type="button"
      title="Create image"
    >🎨</button>

    <button
      id="send"
      class="send"

  </div>

</div>

<!-- LOGIN SCREEN -->

    </div>

    <button
      id="googleLogin"
      class="auth-button google-button"
    >
      Continue with Google
    </button>

    <div style="margin:18px 0;color:#777;">
      or
    </div>

    <input
      id="email"
      class="auth-input"

    >

    <input
      id="password"

  </div>

</div>

<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/*
  REPLACE ONLY THESE VALUES
  WITH YOUR FIREBASE PROJECT VALUES.
*/

// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyD1jcmrhZK_XitZu-9Wa9whFB7BJZn0Wa8",
  authDomain: "zed-ai-6d201.firebaseapp.com",
  projectId: "zed-ai-6d201",
  storageBucket: "zed-ai-6d201.firebasestorage.app",
  messagingSenderId: "538225665227",
  appId: "1:538225665227:web:d61483c3cafa8e4694e74e"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);


const firebaseConfigured =
  !Object.values(firebaseConfig)
    .some(value =>
      String(value).startsWith("YOUR_")
    );


let auth = null;
let googleProvider = null;

if (firebaseConfigured) {

  const firebaseApp =
    initializeApp(firebaseConfig);

  auth = getAuth(firebaseApp);

  googleProvider =
    new GoogleAuthProvider();

}


/* =========================================
   ELEMENTS
========================================= */

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const imageButton =
  document.getElementById("imageButton");

const chatContent =
  document.getElementById("chatContent");

const chat =
  document.getElementById("chat");

const history =
  document.getElementById("history");

const newChatButton =
  document.getElementById("newChat");

const menu =
  document.getElementById("menu");

const sidebar =
  document.getElementById("sidebar");

const headerTitle =
  document.getElementById("headerTitle");

const status =
  document.getElementById("status");

const authScreen =
  document.getElementById("authScreen");

const googleLogin =
  document.getElementById("googleLogin");

const loginButton =
  document.getElementById("loginButton");

const createButton =
  document.getElementById("createButton");

const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const authMessage =
  document.getElementById("authMessage");


/* =========================================
   STORAGE
========================================= */

const STORAGE =
  "zed_ai_chats_final";

const USER_ID_KEY =
  "zed_ai_user_id";

const MEMORY_KEY =
  "zed_ai_memories";


let userId =
  localStorage.getItem(USER_ID_KEY);


if (!userId) {

  userId =
    "user_" +
    Math.random()
      .toString(36)
      .slice(2) +
    Date.now();

  localStorage.setItem(
    USER_ID_KEY,
    userId
  );

}


let memories =
  JSON.parse(
    localStorage.getItem(MEMORY_KEY) || "[]"
  );


let messages = [];


/* =========================================
   AUTH
========================================= */

if (!firebaseConfigured) {

  /*
    Firebase isn't configured yet,
    so Zed AI remains usable.
  */

  authScreen.style.display =
    "none";

} else {

  onAuthStateChanged(
    auth,
    user => {

      if (user) {

        authScreen.style.display =
          "none";

        userId =
          user.uid;

        localStorage.setItem(
          USER_ID_KEY,
          user.uid
        );

      } else {

        authScreen.style.display =
          "flex";

      }

    }
  );

}


/* GOOGLE LOGIN */

googleLogin.addEventListener(
  "click",
  async () => {

    if (!auth) {

      authMessage.textContent =
        "Firebase has not been configured yet.";

      return;

    }

    try {

      authMessage.textContent =
        "Signing in...";

      await signInWithPopup(
        auth,
        googleProvider
      );

    } catch (error) {

      console.error(error);

      authMessage.textContent =
        error.message;

    }

  }
);


/* EMAIL LOGIN */

loginButton.addEventListener(
  "click",
  async () => {

    if (!auth) {

      authMessage.textContent =
        "Firebase has not been configured yet.";

      return;

    }

    try {

      authMessage.textContent =
        "Signing in...";

      await signInWithEmailAndPassword(
        auth,
        email.value.trim(),
        password.value
      );

    } catch (error) {

      console.error(error);

      authMessage.textContent =
        error.message;

    }

  }
);


/* CREATE ACCOUNT */

createButton.addEventListener(
  "click",
  async () => {

    if (!auth) {

      authMessage.textContent =
        "Firebase has not been configured yet.";

      return;

    }

    try {

      authMessage.textContent =
        "Creating account...";

      await createUserWithEmailAndPassword(
        auth,
        email.value.trim(),
        password.value
      );

    } catch (error) {

      console.error(error);

      authMessage.textContent =
        error.message;

    }

  }
);


/* =========================================
   CHAT STORAGE
========================================= */

function getChats() {

  return JSON.parse(
    localStorage.getItem(STORAGE) || "[]"
  );

}


function saveChats(chats) {

  localStorage.setItem(
    STORAGE,
    JSON.stringify(chats)
  );

}


function saveCurrentChat() {

  if (!messages.length) {
    return;
  }

  const chats =
    getChats();

  const firstUserMessage =
    messages.find(
      message =>
        message.role === "user"
    );

  const title =
    firstUserMessage
      ? firstUserMessage.content
      : "New chat";

  chats.unshift({

    id: Date.now(),

    title:
      title.slice(0, 45),

    messages:
      messages

  });

  saveChats(
    chats.slice(0, 30)
  );

  renderHistory();

}


/* =========================================
   HISTORY
========================================= */

function renderHistory() {

  history.innerHTML = "";

  const chats =
    getChats();

  chats.forEach(savedChat => {

    const item =
      document.createElement("div");

    item.className =
      "history-item";

    item.textContent =
      savedChat.title;

    item.addEventListener(
      "click",
      () => {

        messages =
          savedChat.messages || [];

        renderMessages();

        sidebar.classList.remove(
          "open"
        );

      }
    );

    history.appendChild(item);

  });

}


/* =========================================
   RENDER MESSAGES
========================================= */

function renderMessages() {

  chatContent.innerHTML = "";

  messages.forEach(
    message => {

      addMessageToScreen(
        message.role,
        message.content
      );

    }
  );

}


function addMessageToScreen(
  role,
  text
) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " +
    role;

  const bubble =
    document.createElement("div");

  bubble.className =
    "message-bubble";

  bubble.textContent =
    text;

  wrapper.appendChild(
    bubble
  );

  chatContent.appendChild(
    wrapper
  );

  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================================
   NEW CHAT
========================================= */

newChatButton.addEventListener(
  "click",
  () => {

    if (messages.length) {

      saveCurrentChat();

    }

    messages = [];

    chatContent.innerHTML = "";

    input.value = "";

    headerTitle.textContent =
      "Zed AI";

    sidebar.classList.remove(
      "open"
    );

  }
);


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

  const text =
    input.value.trim();

  if (!text) {
    return;
  }

  messages.push({

    role: "user",

    content: text

  });

  addMessageToScreen(
    "user",
    text
  );

  input.value = "";

  send.disabled = true;

  status.textContent =
    "Zed AI is thinking...";


  try {

    const response =
      await fetch("/api/chat", {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            message:
              text,

            conversation:
              messages,

            userId:
              userId,

            memories:
              memories

          })

      });


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Something went wrong."
      );

    }


    const reply =
      data.reply ||
      data.message ||
      "I couldn't generate a response.";


    messages.push({

      role: "assistant",

      content: reply

    });


    addMessageToScreen(
      "assistant",
      reply
    );


    status.textContent = "";


  } catch (error) {

    console.error(error);

    const errorMessage =
      "Sorry, something went wrong. Please try again.";

    messages.push({

      role: "assistant",

      content: errorMessage

    });

    addMessageToScreen(
      "assistant",
      errorMessage
    );

    status.textContent = "";

  }


  send.disabled = false;

}


send.addEventListener(
  "click",
  sendMessage
);


/* ENTER TO SEND */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================
   IMAGE GENERATION
========================================= */

imageButton.addEventListener(
  "click",
  async () => {

    const prompt =
      input.value.trim();

    if (!prompt) {

      input.focus();

      return;

    }


    messages.push({

      role: "user",

      content:
        "Create an image: " +
        prompt

    });


    addMessageToScreen(
      "user",
      "Create an image: " +
      prompt
    );


    input.value = "";

    imageButton.disabled = true;

    status.textContent =
      "Creating image...";


    try {

      const response =
        await fetch(
          "/api/generate-image",
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                prompt:
                  prompt,

                userId:
                  userId

              })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Image generation failed."
        );

      }


      if (data.image) {

        const wrapper =
          document.createElement(
            "div"
          );

        wrapper.className =
          "message assistant";


        const bubble =
          document.createElement(
            "div"
          );

        bubble.className =
          "message-bubble";


        const img =
          document.createElement(
            "img"
          );

        img.src =
          data.image;

        img.style.maxWidth =
          "100%";

        img.style.borderRadius =
          "12px";


        bubble.appendChild(
          img
        );

        wrapper.appendChild(
          bubble
        );

        chatContent.appendChild(
          wrapper
        );

        chat.scrollTop =
          chat.scrollHeight;

      }


      status.textContent = "";


    } catch (error) {

      console.error(error);

      addMessageToScreen(
        "assistant",
        "Sorry, I couldn't create that image."
      );

      status.textContent = "";

    }


    imageButton.disabled = false;

  }
);


/* =========================================
   MOBILE MENU
========================================= */

menu.addEventListener(
  "click",
  () => {

    sidebar.classList.toggle(
      "open"
    );

  }
);


/* =========================================
   STARTUP
========================================= */

renderHistory();

</script>

</body>
</html>
```

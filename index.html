* {

<script type="module">

/* =========================

const firebaseConfig = {

  apiKey:
    "AIzaSyD1jcmrhZK_XitZu-9Wa9whFB7BJZn0Wa8",

    "zed-ai-6d201.firebaseapp.com",

  projectId:
    "zed-ai-6d201",

  storageBucket:
    "zed-ai-6d201.firebasestorage.app",

  messagingSenderId:
    "538225665227",

  appId:
    "1:538225665227:web:d61483c3cafa8e4694e74e"

};


const firebaseApp =

const auth =
  getAuth(firebaseApp);

const db =
  getFirestore(firebaseApp);


/* =========================
   ELEMENTS
========================= */

const authScreen =
  document.getElementById("authScreen");

const app =
  document.getElementById("app");

const googleLogin =
  document.getElementById("googleLogin");

const emailLogin =
  document.getElementById("emailLogin");

const emailSignup =
  document.getElementById("emailSignup");

const emailInput =

const passwordInput =

const authMessage =

const logoutButton =

const accountEmail =
  document.getElementById("accountEmail");

const profilePhoto =
  document.getElementById("profilePhoto");

const newChatButton =
  document.getElementById("newChatButton");

const historyList =
  document.getElementById("historyList");

const chatArea =
  document.getElementById("chatArea");

const chatContent =

const welcome =

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const attachButton =

const attachMenu =
  document.getElementById("attachMenu");

const uploadPhotoButton =
  document.getElementById("uploadPhotoButton");

const uploadFileButton =
  document.getElementById("uploadFileButton");

const createImageButton =
  document.getElementById("createImageButton");

const photoInput =
  document.getElementById("photoInput");

const fileInput =
  document.getElementById("fileInput");

const fileName =
  document.getElementById("fileName");

const micButton =
  document.getElementById("micButton");


/* =========================
   STATE
========================= */

let messages = [];

let selectedFile = null;

let memories = [];

let userId = "guest";

let currentChatId = null;


/* =========================
   LOCAL STORAGE
========================= */

function getLocalChats() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "zed_ai_chats"
      ) || "[]"
    );

  } catch {

    return [];

  }

}


function saveLocalChats(chats) {

  localStorage.setItem(
    "zed_ai_chats",
    JSON.stringify(chats)
  );

}


/* =========================
   MEMORY
========================= */

async function saveMemoryToFirestore(text) {

  if (
    !auth.currentUser ||
    !text
  ) {

    return;

  }


  const memoriesRef =
    collection(
      db,
      "users",
      auth.currentUser.uid,
      "memories"
    );


  const existing =
    memories.find(
      item =>
        item.toLowerCase() ===
        text.toLowerCase()
    );


  if (existing) {

    return;

  }


  await addDoc(
    memoriesRef,
    {
      text,
      createdAt:
        serverTimestamp()
    }
  );


  memories.push(text);

}


async function loadMemories() {

  memories = [];

  if (!auth.currentUser) {

    return;

  }


  try {

    const memoriesRef =
      collection(
        db,
        "users",
        auth.currentUser.uid,
        "memories"
      );


    const snapshot =
      await getDocs(
        query(
          memoriesRef,
          orderBy(
            "createdAt",
            "asc"
          )
        )
      );


    snapshot.forEach(
      item => {

        const data =
          item.data();

        if (
          typeof data.text === "string" &&
          data.text.trim()
        ) {

          memories.push(
            data.text.trim()
          );

        }

      }
    );


  } catch (error) {

    console.error(
      "Could not load memories:",
      error
    );

  }

}


function extractMemory(text) {

  if (
    !/^remember\b/i.test(text)
  ) {

    return null;

  }


  const memoryText =
    text
      .replace(
        /^remember\b\s*(that)?\s*/i,
        ""
      )
      .trim();


  return memoryText || null;

}


/* =========================
   CHAT HISTORY
========================= */

async function saveChatToCloud() {

  if (
    !auth.currentUser ||
    messages.length === 0
  ) {

    return;

  }


  try {

    const chatsRef =
      collection(
        db,
        "users",
        auth.currentUser.uid,
        "chats"
      );


    if (!currentChatId) {

      const newChat =
        doc(chatsRef);

      currentChatId =
        newChat.id;


      await setDoc(
        newChat,
        {

          title:
            messages.find(
              message =>
                message.role === "user"
            )?.content
              ?.slice(0, 45) ||
            "New chat",

          messages,

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }
      );


    } else {

      const chatRef =
        doc(
          db,
          "users",
          auth.currentUser.uid,
          "chats",
          currentChatId
        );


      await setDoc(
        chatRef,
        {

          messages,

          updatedAt:
            serverTimestamp()

        },
        {
          merge: true
        }
      );

    }

  } catch (error) {

    console.error(
      "Cloud chat save failed:",
      error
    );

  }

}


async function loadCloudHistory() {

  historyList.innerHTML = "";

  if (!auth.currentUser) {

    return;

  }


  try {

    const chatsRef =
      collection(
        db,
        "users",
        auth.currentUser.uid,
        "chats"
      );


    const snapshot =
      await getDocs(chatsRef);


    const chats = [];


    snapshot.forEach(
      item => {

        chats.push({

          id: item.id,

          ...item.data()

        });

      }
    );


    chats.sort(
      (a, b) => {

        const aTime =
          a.updatedAt?.seconds || 0;

        const bTime =
          b.updatedAt?.seconds || 0;

        return bTime - aTime;

      }
    );


    chats.forEach(
      chat => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "historyItem";


        item.textContent =
          chat.title ||
          "New chat";


        item.addEventListener(
          "click",
          () => loadCloudChat(chat)
        );


        historyList.appendChild(
          item
        );

      }
    );


  } catch (error) {

    console.error(
      "Could not load cloud history:",
      error
    );

  }

}


function saveCurrentChatLocally() {

  if (!messages.length) {

    return;

  }


  const chats =
    getLocalChats();


  if (!currentChatId) {

    currentChatId =
      "local-" +
      Date.now();

  }


  const existingIndex =
    chats.findIndex(
      chat =>
        chat.id ===
        currentChatId
    );


  const chatData = {

    id:
      currentChatId,

    title:
      messages.find(
        message =>
          message.role === "user"
      )?.content
        ?.slice(0, 45) ||
      "New chat",

    messages,

    updatedAt:
      Date.now()

  };


  if (existingIndex >= 0) {

    chats[existingIndex] =
      chatData;

  } else {

    chats.unshift(
      chatData
    );

  }


  saveLocalChats(chats);

}


async function saveCurrentChat() {

  saveCurrentChatLocally();

  await saveChatToCloud();

  await loadCloudHistory();

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages() {

  chatContent.innerHTML = "";


  if (!messages.length) {

    chatContent.appendChild(
      welcome
    );

    return;

  }


  messages.forEach(
    message => {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "message " +
        (
          message.role === "user"
            ? "user"
            : "assistant"
        );


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "messageBubble";


      bubble.textContent =
        message.content || "";


      wrapper.appendChild(
        bubble
      );


      chatContent.appendChild(
        wrapper
      );

    }
  );


  chatArea.scrollTop =
    chatArea.scrollHeight;

}


function loadCloudChat(chat) {

  currentChatId =
    chat.id;

  messages =
    Array.isArray(
      chat.messages
    )
      ? chat.messages
      : [];

  renderMessages();

}


/* =========================
   NEW CHAT
========================= */

function newChat() {

  messages = [];

  currentChatId = null;

  selectedFile = null;

  fileName.textContent = "";

  messageInput.value = "";

  renderMessages();

  messageInput.focus();

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  const text =
    messageInput.value.trim();


  if (
    !text &&
    !selectedFile
  ) {

    return;

  }


  const memoryText =
    extractMemory(text);


  if (memoryText) {

    try {

      await saveMemoryToFirestore(
        memoryText
      );

    } catch (error) {

      console.error(
        "Memory save failed:",
        error
      );

    }

  }


  const userMessage = {

    role: "user",

    content:
      text ||
      "Please analyze this uploaded file."

  };


  messages.push(
    userMessage
  );


  renderMessages();


  messageInput.value = "";


  sendButton.disabled = true;


  let filePayload = null;


  if (selectedFile) {

    try {

      filePayload = {

        name:
          selectedFile.name,

        mimeType:
          selectedFile.type,

        data:
          await readFileAsDataURL(
            selectedFile
          )

      };

    } catch (error) {

      console.error(
        "File reading failed:",
        error
      );

      sendButton.disabled =
        false;

      return;

    }

  }


  try {

    const response =
      await fetch(
        "/api/chat",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                text,

              userId,

              memories,

              conversation:
                messages
                  .slice(0, -1)
                  .map(
                    message => ({
                      role:
                        message.role,

                      text:
                        message.content
                    })
                  ),

              file:
                filePayload

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Zed AI could not respond."
      );

    }


    messages.push({

      role: "assistant",

      content:
        data.reply ||
        "I received your message."

    });


    renderMessages();


    await saveCurrentChat();


  } catch (error) {

    console.error(
      "Chat error:",
      error
    );


    messages.push({

      role: "assistant",

      content:
        "Sorry, I couldn't complete that request. " +
        error.message

    });


    renderMessages();


  } finally {

    selectedFile = null;

    fileName.textContent = "";

    sendButton.disabled =
      false;

  }

}


/* =========================
   FILE READER
========================= */

function readFileAsDataURL(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================
   IMAGE GENERATION
========================= */

async function createImage() {

  const prompt =
    messageInput.value.trim();


  if (!prompt) {

    alert(
      "Describe the image you want Zed AI to create."
    );

    return;

  }


  attachMenu.classList.add(
    "hidden"
  );


  sendButton.disabled =
    true;


  try {

    const response =
      await fetch(
        "/api/generate-image",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              prompt
            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Image generation failed."
      );

    }


    messages.push({

      role: "user",

      content:
        "Create an image: " +
        prompt

    });


    messages.push({

      role: "assistant",

      content:
        "Image created successfully."

    });


    renderMessages();


    const image =
      document.createElement(
        "img"
      );


    image.src =
      data.image;


    image.style.maxWidth =
      "100%";


    image.style.borderRadius =
      "12px";


    image.style.marginTop =
      "10px";


    chatContent.appendChild(
      image
    );


    messageInput.value = "";


    await saveCurrentChat();


  } catch (error) {

    console.error(
      "Image generation error:",
      error
    );


    alert(
      error.message
    );


  } finally {

    sendButton.disabled =
      false;

  }

}

/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async user => {

    if (user) {

      userId =
        user.uid;


      authScreen.classList.add(
        "hidden"
      );


      app.classList.remove(
        "hidden"
      );


      accountName.textContent =
        user.displayName ||
        "Zed AI User";


      accountEmail.textContent =
        user.email ||
        "";


      if (user.photoURL) {

        profilePhoto.src =
          user.photoURL;

      } else {

        profilePhoto.src =
          "data:image/svg+xml," +
          encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="80"
                 height="80">
              <rect width="100%"
                    height="100%"
                    fill="#444"/>
              <text x="50%"
                    y="55%"
                    text-anchor="middle"
                    fill="white"
                    font-size="30">
                Z
              </text>
            </svg>
          `);

      }


      await loadMemories();

      await loadCloudHistory();


    } else {

      userId =
        "guest";


      memories = [];


      authScreen.classList.remove(
        "hidden"
      );


      app.classList.add(
        "hidden"
      );

    }

  }
);


/* =========================
   VOICE INPUT
========================= */

let recognition = null;


if (
  "webkitSpeechRecognition" in window ||
  "SpeechRecognition" in window
) {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";


  recognition.interimResults =
    false;


  recognition.continuous =
    false;


  recognition.onresult =
    event => {

      const transcript =
        event.results[0][0]
          .transcript;


      messageInput.value =
        transcript;

    };


  recognition.onerror =
    error => {

      console.error(
        "Voice recognition error:",
        error
      );

    };

}


micButton.addEventListener(
  "click",
  () => {

    if (!recognition) {

      alert(
        "Voice input is not supported by this browser."
      );

      return;

    }


    recognition.start();

  }
);

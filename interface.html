
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zed AI</title>

  <!-- Main interface styling -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-top">
        <button class="new-chat-btn" id="newChatBtn">
          <span>＋</span>
          <span>New chat</span>
        </button>
      </div>

      <div class="recent-section">
        <div class="section-title">Recent</div>

        <div class="recent-chats" id="recentChats">
          <!-- Recent conversations will be inserted by app.js -->
        </div>
      </div>

      <div class="sidebar-bottom">

        <button class="sidebar-item" id="settingsBtn">
          <span>⚙</span>
          <span>Settings</span>
        </button>

        <button class="sidebar-item" id="accountBtn">
          <span>●</span>
          <span>Account</span>
        </button>

      </div>
    </aside>


    <!-- MAIN AREA -->
    <main class="main">

      <!-- HEADER -->
      <header class="topbar">

        <div class="topbar-left">
          <button class="menu-btn" id="menuBtn" aria-label="Open menu">
            ☰
          </button>

          <div class="brand">
            <div class="brand-name">Zed AI</div>
            <div class="brand-status">
              <span class="status-dot"></span>
              Online
            </div>
          </div>
        </div>

        <button class="profile-btn" id="profileBtn" aria-label="Account">
          ●
        </button>

      </header>


      <!-- CHAT -->
      <section class="chat-area">

        <!-- Welcome screen -->
        <div class="welcome" id="welcome">

          <div class="welcome-logo">
            Z
          </div>

          <h1>How can I help you?</h1>

          <p>
            Ask Zed AI anything. Study, write, search, analyze files,
            explore football, or work on your ideas.
          </p>

        </div>


        <!-- Messages -->
        <div class="messages" id="messages">
          <!-- Messages will be added by app.js -->
        </div>

      </section>


      <!-- COMPOSER -->
      <footer class="composer-container">

        <div class="composer">

          <!-- Attach button -->
          <button
            class="composer-btn"
            id="attachBtn"
            type="button"
            aria-label="Attach"
          >
            ＋
          </button>

          <!-- Hidden file input -->
          <input
            type="file"
            id="fileInput"
            hidden
            accept=".pdf,.txt,.csv,.doc,.docx,.xls,.xlsx,image/*"
          >

          <textarea
            id="messageInput"
            rows="1"
            placeholder="Message Zed AI..."
            autocomplete="off"
          ></textarea>

          <button
            class="composer-btn send-btn"
            id="sendBtn"
            type="button"
            aria-label="Send message"
          >
            ↑
          </button>

        </div>


        <!-- Attach menu -->
        <div class="attach-menu" id="attachMenu">

          <button id="uploadPhotoBtn">
            <span>🖼️</span>
            Upload photo
          </button>

          <button id="uploadFileBtn">
            <span>📎</span>
            Upload file
          </button>

          <button id="createImageBtn">
            <span>🎨</span>
            Create image
          </button>

        </div>


        <div class="composer-note">
          Zed AI can make mistakes. Check important information.
        </div>

      </footer>

    </main>

  </div>


  <!-- Main interface JavaScript -->
  <script src="app.js"></script>

</body>
</html>

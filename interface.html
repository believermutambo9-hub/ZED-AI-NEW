<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zed AI</title>

  <meta
    name="description"
    content="Zed AI — your intelligent AI assistant."
  >

  <!-- Prevent theme flashing while the page loads -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem("zed-theme");

      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      } else {
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;

        document.documentElement.dataset.theme =
          prefersDark ? "dark" : "light";
      }
    })();
  </script>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app" id="app">

    <!-- =========================
         SIDEBAR
    ========================== -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-header">

        <button
          class="new-chat-btn"
          id="newChatBtn"
          type="button"
        >
          <span class="new-chat-icon">＋</span>
          <span>New chat</span>
        </button>

      </div>


      <div class="recent-section">

        <div class="section-title">
          Recent
        </div>

        <div
          class="recent-chats"
          id="recentChats"
        >
          <!-- Added by app.js -->
        </div>

      </div>


      <div class="sidebar-bottom">

        <button
          class="sidebar-item"
          id="settingsBtn"
          type="button"
        >
          <span class="sidebar-item-icon">⚙</span>
          <span>Settings</span>
        </button>


        <button
          class="sidebar-item"
          id="accountBtn"
          type="button"
        >
          <span class="sidebar-item-icon account-icon">●</span>
          <span>Account</span>
        </button>

      </div>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="main">


      <!-- =========================
           TOP BAR
      ========================== -->
      <header class="topbar">

        <div class="topbar-left">

          <button
            class="menu-btn"
            id="menuBtn"
            type="button"
            aria-label="Open menu"
          >
            ☰
          </button>


          <div class="brand">

            <div class="brand-name">
              Zed AI
            </div>

            <div class="brand-status">

              <span class="status-dot"></span>

              <span>Online</span>

            </div>

          </div>

        </div>


        <button
          class="profile-btn"
          id="profileBtn"
          type="button"
          aria-label="Account"
        >
          ●
        </button>

      </header>



      <!-- =========================
           CHAT AREA
      ========================== -->
      <section class="chat-area">


        <!-- Welcome -->
        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-logo">
            Z
          </div>


          <h1>
            How can I help you?
          </h1>


          <p>
            Ask Zed AI anything. Study, write, search,
            analyze files, explore football, or work
            on your ideas.
          </p>

        </div>


        <!-- Conversation messages -->
        <div
          class="messages"
          id="messages"
        >
          <!-- Messages inserted by app.js -->
        </div>


      </section>



      <!-- =========================
           MESSAGE COMPOSER
      ========================== -->
      <footer class="composer-container">


        <div class="composer">


          <!-- Attachment -->
          <button
            class="composer-btn attach-button"
            id="attachBtn"
            type="button"
            aria-label="Add attachment"
          >
            ＋
          </button>


          <!-- File input -->
          <input
            type="file"
            id="fileInput"
            hidden
            accept=".pdf,.txt,.csv,.doc,.docx,.xls,.xlsx,image/*"
          >


          <!-- Message -->
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Message Zed AI..."
            autocomplete="off"
            aria-label="Message Zed AI"
          ></textarea>


          <!-- Send -->
          <button
            class="composer-btn send-btn"
            id="sendBtn"
            type="button"
            aria-label="Send message"
          >
            ↑
          </button>

        </div>



        <!-- =========================
             ATTACHMENT MENU
        ========================== -->
        <div
          class="attach-menu"
          id="attachMenu"
        >

          <button
            id="uploadPhotoBtn"
            type="button"
          >
            <span>🖼️</span>
            <span>Upload photo</span>
          </button>


          <button
            id="uploadFileBtn"
            type="button"
          >
            <span>📎</span>
            <span>Upload file</span>
          </button>


          <button
            id="createImageBtn"
            type="button"
          >
            <span>🎨</span>
            <span>Create image</span>
          </button>

        </div>



        <!-- Disclaimer -->
        <div class="composer-note">
          Zed AI can make mistakes. Check important information.
        </div>

      </footer>

    </main>

  </div>


  <!-- Main application JavaScript -->
  <script src="app.js"></script>

</body>
</html>

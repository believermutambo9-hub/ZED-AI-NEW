<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zed</title>

  <meta
    name="description"
    content="Zed — your intelligent AI assistant."
  >

  <!-- Prevent theme flashing while the page loads -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem("zed-theme");
        document.documentElement.dataset.theme =
          savedTheme === "light" || savedTheme === "dark" ? savedTheme : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="super-brain.svg?v=2">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app" id="app">

    <!-- =========================
         SIDEBAR
    ========================== -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-header">

        <button
          class="new-chat-btn"
          id="newChatBtn"
          type="button"
        >
          <span class="new-chat-icon">＋</span>
          <span>New chat</span>
        </button>

      </div>

      <div class="recent-section">

        <div class="section-title">
          Recent
        </div>

        <div
          class="recent-chats"
          id="recentChats"
        >
          <!-- Added by app.js -->
        </div>

      </div>

      <div class="sidebar-bottom">

        <button
          class="sidebar-item"
          id="settingsBtn"
          type="button"
        >
          <span class="sidebar-item-icon">⚙</span>
          <span>Settings</span>
        </button>

        <button
          class="sidebar-item"
          id="accountBtn"
          type="button"
        >
          <span class="sidebar-item-icon account-icon">●</span>
          <span>Account</span>
        </button>

      </div>

    </aside>

    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="main">

      <!-- =========================
           TOP BAR
      ========================== -->
      <header class="topbar">

        <div class="topbar-left">

          <button
            class="menu-btn"
            id="menuBtn"
            type="button"
            aria-label="Open menu"
          >
            ☰
          </button>

          <div class="brand">

            <img class="brand-logo" src="super-brain.svg?v=2" alt="" width="32" height="32" style="width:32px;height:32px;object-fit:cover;border-radius:50%;flex-shrink:0;">

            <div class="brand-name">Zed</div>

            <div class="brand-status">

              <span class="status-dot"></span>

              <span>Online</span>

            </div>

          </div>

        </div>

        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light theme" title="Switch theme">
          <span aria-hidden="true" id="themeToggleIcon">☼</span>
        </button>

        <button
          class="profile-btn"
          id="profileBtn"
          type="button"
          aria-label="Account"
        >
          ●
        </button>

      </header>

      <!-- =========================
           CHAT AREA
      ========================== -->
      <section class="chat-area">

        <!-- Welcome -->
        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-logo" aria-label="Zed Super Brain logo" role="img"></div>

          <h1>
            How can I help you?
          </h1>

          <p>
            Your ideas, questions and next steps start here.
          </p>

          <div class="suggestion-grid" aria-label="Try a prompt">
            <button class="suggestion-card" type="button" data-prompt="Explain a difficult topic to me step by step, with simple examples.">
              <span class="suggestion-icon">✳</span>
              <span class="suggestion-copy"><strong>Learn something</strong><small>Understand a topic step by step</small></span>
            </button>
            <button class="suggestion-card" type="button" data-prompt="Help me write a clear, professional message. Ask me what it is for if needed.">
              <span class="suggestion-icon">↗</span>
              <span class="suggestion-copy"><strong>Write anything</strong><small>Messages, letters and ideas</small></span>
            </button>
            <button class="suggestion-card" type="button" data-prompt="Help me plan a realistic small business idea with a limited budget.">
              <span class="suggestion-icon">⌁</span>
              <span class="suggestion-copy"><strong>Build an idea</strong><small>Turn a goal into a plan</small></span>
            </button>
            <button class="suggestion-card" type="button" data-prompt="Analyze this football match using current, verifiable data. Separate facts from estimates and show uncertainty.">
              <span class="suggestion-icon">◎</span>
              <span class="suggestion-copy"><strong>Analyze football</strong><small>Evidence-led match analysis</small></span>
            </button>
          </div>

        </div>

        <!-- Conversation messages -->
        <div
          class="messages"
          id="messages"
        >
          <!-- Messages inserted by app.js -->
        </div>

      </section>

      <!-- =========================
           MESSAGE COMPOSER
      ========================== -->
      <footer class="composer-container">

        <div class="composer">

          <!-- Attachment -->
          <button
            class="composer-btn attach-button"
            id="attachBtn"
            type="button"
            aria-label="Add attachment"
          >
            ＋
          </button>

          <!-- File input -->
          <input
            type="file"
            id="fileInput"
            hidden
            accept=".pdf,.txt,.csv,.tsv,.md,.json,.xml,.html,.htm,.js,.mjs,.ts,.tsx,.jsx,.css,.scss,.log,.rtf,.yaml,.yml,.toml,.ini,.conf,.config,.env,.py,.java,.c,.h,.cpp,.hpp,.cs,.go,.rs,.php,.rb,.sh,.bash,.sql,.ipynb,.vue,.svelte,.gradle,.properties,.makefile,.dockerfile,.docx,.xls,.xlsx,.pptx,.odt,.odp,.epub,.jpg,.jpeg,.png,.gif,.webp"
          >

          <!-- Message -->
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Message..."
            autocomplete="off"
            aria-label="Message"
          ></textarea>

          <!-- Send -->
          <button
            class="composer-btn send-btn"
            id="sendBtn"
            type="button"
            aria-label="Send message"
          >
            ↑
          </button>

        </div>

        <!-- =========================
             ATTACHMENT MENU
        ========================== -->
        <div
          class="attach-menu"
          id="attachMenu"
        >

          <button
            id="uploadPhotoBtn"
            type="button"
          >
            <span>🖼️</span>
            <span>Upload photo</span>
          </button>

          <button
            id="uploadFileBtn"
            type="button"
          >
            <span>📎</span>
            <span>Upload file</span>
          </button>

          <button
            id="createImageBtn"
            type="button"
          >
            <span>🎨</span>
            <span>Create image</span>
          </button>

        </div>

        <!-- Disclaimer -->
        <div id="selectedFileChip" class="selected-file-chip" hidden></div>

        <div class="composer-note">
          Zed can make mistakes. Check important information.
        </div>

      </footer>

    </main>

  </div>

  <!-- Main application JavaScript -->
  <script src="app.js"></script>
  <script src="ui-enhancements.js"></script>

</body>
</html>

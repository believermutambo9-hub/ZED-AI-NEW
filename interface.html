<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zed</title>

  <meta
    name="description"
    content="Zed — your intelligent AI assistant."
  >

  <!-- Prevent theme flashing while the page loads -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem("zed-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        } else {
          document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="super-brain.svg?v=2">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app" id="app">

    <!-- Navigation drawer: opens over the home screen on mobile. -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand-row">
        <div class="sidebar-brand">Zed</div>
        <button class="sidebar-search-toggle" id="sidebarSearchToggle" type="button" aria-label="Search conversations">⌕</button>
      </div>
      <div class="sidebar-search-wrap" id="sidebarSearchWrap">
        <input id="chatSearchInput" type="search" placeholder="Search conversations" aria-label="Search conversations">
      </div>
      <nav class="primary-nav" aria-label="Zed tools">
        <button class="nav-item" type="button" data-zed-view="images"><span class="nav-icon">▧</span><span>Images</span></button>
        <button class="nav-item" type="button" data-zed-view="library"><span class="nav-icon">▤</span><span>Library</span></button>
        <button class="nav-item" type="button" data-zed-view="projects"><span class="nav-icon">▱</span><span>Projects</span></button>
        <button class="nav-item" type="button" data-zed-view="scheduled"><span class="nav-icon">◷</span><span>Scheduled</span></button>
        <button class="nav-item" type="button" data-zed-view="explore"><span class="nav-icon">✣</span><span>Explore</span></button>
      </nav>
      <div class="sidebar-divider"></div>
      <section class="sidebar-projects" aria-label="Projects">
        <div class="sidebar-section-heading">
          <span>Projects</span>
          <button id="addProjectBtn" type="button" aria-label="Create project">＋</button>
        </div>
        <div id="projectList" class="project-list"><div class="sidebar-empty">Loading projects…</div></div>
      </section>
      <section class="recent-section">
        <div class="sidebar-section-heading"><span>Recent</span></div>
        <div class="recent-chats" id="recentChats"></div>
        <button class="see-all-chats" id="seeAllChatsBtn" type="button">See all</button>
      </section>
      <div class="sidebar-bottom">
        <button class="sidebar-item zed-new-chat-nav" id="newChatBtn" type="button"><span class="sidebar-item-icon">✎</span><span>Chat</span></button>
        <button class="sidebar-item" id="settingsBtn" type="button"><span class="sidebar-item-icon">⚙</span><span>Settings</span></button>
        <button class="sidebar-item" id="accountBtn" type="button"><span class="sidebar-item-icon">●</span><span>Account</span></button>
      </div>
    </aside>
    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="main">

      <!-- =========================
           TOP BAR
      ========================== -->
      <header class="topbar">

        <div class="topbar-left">

          <button
            class="menu-btn"
            id="menuBtn"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            ☰
          </button>

          <button class="upgrade-btn" id="upgradeBtn" type="button">✦ Upgrade</button>
          <div class="brand">

            <img class="brand-logo" src="super-brain.svg?v=2" alt="" width="32" height="32" style="width:32px;height:32px;object-fit:cover;border-radius:50%;flex-shrink:0;">

            <div class="brand-name">Zed</div>

            <div class="brand-status">

              <span class="status-dot"></span>

              <span>Online</span>

            </div>

          </div>

        </div>

        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme" title="Switch theme"><span aria-hidden="true" id="themeToggleIcon">☼</span></button>

        <button
          class="profile-btn"
          id="profileBtn"
          type="button"
          aria-label="Account"
        >
          ●
        </button>

      </header>

      <!-- =========================
           CHAT AREA
      ========================== -->
      <section class="chat-area">

        <!-- Welcome -->
        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-logo" aria-label="Zed Super Brain logo" role="img"></div>
          <div class="welcome-actions" aria-label="Quick actions">
            <button type="button" data-zed-action="image"><span>▧</span> Create an image or sticker</button>
            <button type="button" data-zed-prompt="Help me write or edit the following: "><span>✎</span> Write or edit</button>
            <button type="button" data-zed-prompt="Search the web for: "><span>◎</span> Search the web</button>
          </div>

          <h1>
            How can I help you?
          </h1>

          <p>
            Ask anything. Study, write, search,
            analyze files, explore football, or work
            on your ideas.
          </p>

        </div>

        <!-- Conversation messages -->
        <div
          class="messages"
          id="messages"
        >
          <!-- Messages inserted by app.js -->
        </div>

      </section>

      <!-- =========================
           MESSAGE COMPOSER
      ========================== -->
      <footer class="composer-container">

        <div class="composer">

          <!-- Attachment -->
          <button
            class="composer-btn attach-button"
            id="attachBtn"
            type="button"
            aria-label="Add attachment"
          >
            ＋
          </button>

          <!-- File input -->
          <input
            type="file"
            id="fileInput"
            hidden
            accept=".pdf,.txt,.csv,.tsv,.md,.json,.xml,.html,.htm,.js,.mjs,.ts,.tsx,.jsx,.css,.scss,.log,.rtf,.yaml,.yml,.toml,.ini,.conf,.config,.env,.py,.java,.c,.h,.cpp,.hpp,.cs,.go,.rs,.php,.rb,.sh,.bash,.sql,.ipynb,.vue,.svelte,.gradle,.properties,.makefile,.dockerfile,.docx,.xls,.xlsx,.pptx,.odt,.odp,.epub,.jpg,.jpeg,.png,.gif,.webp"
          >

          <!-- Message -->
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Message..."
            autocomplete="off"
            aria-label="Message"
          ></textarea>

          <button class="composer-btn voice-input-btn" id="voiceInputBtn" type="button" aria-label="Dictate a message" title="Dictate a message">🎙</button>
          <button class="composer-btn voice-mode-btn" id="voiceModeBtn" type="button" aria-label="Toggle spoken responses" title="Toggle spoken responses">▮))</button>

          <!-- Send -->
          <button
            class="composer-btn send-btn"
            id="sendBtn"
            type="button"
            aria-label="Send message"
          >
            ↑
          </button>

        </div>

        <!-- =========================
             ATTACHMENT MENU
        ========================== -->
        <div
          class="attach-menu"
          id="attachMenu"
        >

          <button
            id="uploadPhotoBtn"
            type="button"
          >
            <span>🖼️</span>
            <span>Upload photo</span>
          </button>

          <button
            id="uploadFileBtn"
            type="button"
          >
            <span>📎</span>
            <span>Upload file</span>
          </button>

          <button
            id="createImageBtn"
            type="button"
          >
            <span>🎨</span>
            <span>Create image</span>
          </button>

        </div>

        <!-- Disclaimer -->
        <div id="selectedFileChip" class="selected-file-chip" hidden></div>

        <div class="composer-note">
          Zed can make mistakes. Check important information.
        </div>

      </footer>

    </main>

  </div>

  <!-- Main application JavaScript -->
  <script src="app.js"></script>
  <script src="ui-enhancements.js"></script>

</body>
</html>
